<!-- קובץ זה נוצר אוטומטית על ידי tools/build_web.py. אין לערוך אותו ידנית - יש לערוך את web/template.html ולהריץ make. -->
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<title>מחשבון גיוס</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --bg: #eff2f7;
    --card: #ffffff;
    --ink: #0b2540;
    --muted: #5b7089;
    --faint: #8a99ad;
    --line: #dfe5f0;
    --brand: #0052cc;
    --brand-2: #3d8bff;
    --brand-soft: #e9f1ff;
    --good: #0a7a52;
    --good-soft: #e4f7ef;
    --bad: #c13737;
    --bad-soft: #ffedec;
    --warn: #8a5a00;
    --warn-soft: #fff4e0;
    --shadow: 0 6px 20px rgba(9, 30, 66, .09);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.55;
    overflow-x: hidden;
  }

  .wrap { max-width: 1020px; margin: 0 auto; padding: 22px 15px 64px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 20px 22px 22px;
    margin-bottom: 15px;
  }

  h1 { font-size: 23px; margin: 0 0 4px; letter-spacing: -.2px; }
  h2 { font-size: 15px; margin: 0 0 4px; }

  .sub { font-size: 13px; color: var(--muted); margin: 0 0 4px; }

  /* ---------- קלט ---------- */
  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px 14px; }
  .field { display: flex; flex-direction: column; gap: 5px; font-size: 12.5px; min-width: 0; }
  .field label { color: var(--muted); font-weight: 500; }
  .field input {
    width: 100%;
    border: 1px solid #ccd5e4; border-radius: 10px; padding: 10px 8px;
    font-size: 16px; text-align: center; background: #fafbfd;
    color: var(--ink); outline: none; font-family: inherit;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .field input:focus {
    border-color: var(--brand); background: #fff;
    box-shadow: 0 0 0 3px rgba(0, 82, 204, .13);
  }
  .field.no-data label { color: var(--warn); }
  .field.no-data input { background: #fffaf0; border-color: #e8d3a8; }
  .field.target label { color: var(--bad); font-weight: 700; }
  .field.target input { border-color: #f0b6b6; background: #fff7f7; }
  .field.when label { color: var(--brand); font-weight: 700; }
  .field.when input { border-color: #b9cef0; background: #f7faff; font-size: 14px; }
  .hint { font-size: 11px; color: var(--warn); line-height: 1.35; }

  .pick {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    margin: 2px 0 6px; font-size: 12.5px;
  }
  .pick label { color: var(--muted); font-weight: 500; }
  .pick select {
    border: 1px solid #ccd5e4; border-radius: 10px; padding: 8px 11px;
    font-size: 14px; background: #fafbfd; color: var(--ink);
    font-family: inherit; outline: none; font-weight: 600;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .pick select:focus {
    border-color: var(--brand); background: #fff;
    box-shadow: 0 0 0 3px rgba(0, 82, 204, .13);
  }

  .row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
  button {
    border: none; border-radius: 10px; padding: 11px 26px;
    font-size: 15px; cursor: pointer; font-family: inherit; font-weight: 600;
    transition: transform .12s, background .15s, box-shadow .15s;
  }
  button:active { transform: scale(.97); }
  .primary {
    background: linear-gradient(135deg, var(--brand), var(--brand-2));
    color: #fff; box-shadow: 0 4px 14px rgba(0, 82, 204, .3);
  }
  .ghost { background: #f1f4f9; color: var(--muted); border: 1px solid var(--line); font-weight: 500; }

  /* ---------- הופעת התוצאות ---------- */
  .reveal {
    opacity: 0; transform: translateY(14px);
    transition: opacity .5s ease, transform .5s cubic-bezier(.2, .7, .3, 1);
  }
  .reveal.in { opacity: 1; transform: none; }

  /* ---------- כרטיס התוצאה הראשי ---------- */
  .hero {
    background: linear-gradient(135deg, #06326e, #0a58c2 55%, #2f7ff0);
    color: #fff; border: none; text-align: center;
    padding: 24px 20px 22px;
    box-shadow: 0 10px 30px rgba(6, 50, 110, .32);
  }
  .hero .cap { font-size: 12.5px; opacity: .82; }
  .hero .big {
    font-size: 58px; font-weight: 800; line-height: 1.05;
    font-variant-numeric: tabular-nums; letter-spacing: -1.5px;
  }
  .hero .note { font-size: 13px; opacity: .9; margin-top: 6px; }
  .hero .from {
    font-size: 12px; opacity: .8; margin-top: 8px;
    border-top: 1px solid rgba(255, 255, 255, .22); padding-top: 8px;
  }

  /* סרגל דביק - מספר הגיוסים נשאר גלוי גם כשגוללים לגרפים */
  .sticky {
    position: sticky; top: 0; z-index: 20;
    background: linear-gradient(135deg, #06326e, #0a58c2);
    color: #fff; border-radius: 0 0 13px 13px;
    padding: 9px 16px; margin: 0 -15px 15px;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    box-shadow: 0 4px 14px rgba(6, 50, 110, .3);
    font-size: 13px;
    transform: translateY(-100%); opacity: 0; pointer-events: none;
    transition: transform .3s ease, opacity .3s ease;
  }
  .sticky.show { transform: none; opacity: 1; pointer-events: auto; }
  .sticky .n { font-size: 21px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .sticky .lbl { opacity: .85; }

  /* ---------- גרף 1: כמה בכל שלב ---------- */
  .funnel { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
  .fstage {
    display: grid; grid-template-columns: 148px 1fr 78px;
    align-items: center; gap: 6px 12px;
  }
  .fhead { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
  .fname { font-weight: 600; font-size: 13.5px; }
  .fpct { font-size: 11.5px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .ftrack { background: #eef1f6; border-radius: 8px; height: 28px; overflow: hidden; }
  .fbar {
    height: 100%; width: 0; border-radius: 8px;
    background: linear-gradient(90deg, var(--brand), var(--brand-2));
    transition: width .8s cubic-bezier(.2, .7, .3, 1);
  }
  .fval { text-align: left; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; }
  .fstage.source .fname { color: var(--brand); }
  .fstage.source .fbar { background: linear-gradient(90deg, #4a5b73, #8a99ad); }
  .fstage.hire .fname, .fstage.hire .fval { color: var(--good); }
  .fstage.hire .fbar { background: linear-gradient(90deg, #0a7a52, #24b581); }
  .fstage.nodata .fname { color: var(--warn); }
  .fval.blocked { font-size: 12.5px; font-weight: 700; color: var(--bad); }
  .chip {
    font-size: 10.5px; font-weight: 700; background: var(--brand); color: #fff;
    border-radius: 999px; padding: 1px 7px;
  }

  /* ---------- המחשבון עם האילוצים: משפך דו-נתיבי ---------- */
  /* שני נתיבים בתוך אותו עמוד: «אוכלוסייה מוכרת» שאינה עוברת מיון
     ואינה גדלה, ו«אוכלוסייה חדשה» שהיא היחידה שנגזרת מההגשות.
     הצבע מפריד ביניהם בכל שלב, כדי שיהיה גלוי מיד איזה חלק מהנפח
     בכלל תלוי בכמות ההגשות.                                          */
  .fbar.split { display: flex; background: none; }
  .fseg { height: 100%; width: 0; transition: width .8s cubic-bezier(.2,.7,.3,1); }
  .fseg.newpop { background: linear-gradient(90deg, var(--brand), var(--brand-2)); }
  .fseg.knownpop { background: linear-gradient(90deg, #a8730f, #e0a83a); }
  .fstage.hire .fseg.newpop { background: linear-gradient(90deg, #0a7a52, #24b581); }
  /* תחנת צד: מרכז הערכה. מתוארת בקו מקווקו כדי שלא תיקרא כתחנת חובה. */
  .fstage.aside .fname { color: var(--faint); font-weight: 500; }
  .fstage.aside .ftrack { background: transparent; border: 1px dashed #c6cedb; }
  .fstage.aside .fbar { background: repeating-linear-gradient(135deg, #c6cedb 0 6px, #dde3ec 6px 12px); }
  .fstage.aside .fval { color: var(--faint); font-weight: 600; }
  .lanes { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0 4px; }
  .lanebox { flex: 1 1 210px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
  .lanebox .lname { font-size: 11.5px; color: var(--faint); }
  .lanebox .lval { font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .lanebox .lwhy { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
  .lanebox.known { border-inline-start: 4px solid #e0a83a; }
  .lanebox.newp { border-inline-start: 4px solid var(--brand); }
  .lanebox.tot { border-inline-start: 4px solid var(--good); }

  /* ---------- גרף 2: מתי בכל שלב ---------- */
  .tl { margin-top: 14px; }
  .tlrow {
    display: grid; grid-template-columns: 148px 1fr 78px;
    align-items: center; gap: 6px 12px; margin-bottom: 11px;
  }
  .tltrack {
    position: relative; height: 28px;
    background: linear-gradient(to left, #eef1f6, #f6f8fb);
    border-radius: 8px;
  }
  /* הזמן זורם מימין לשמאל, בכיוון הקריאה */
  .tlfill {
    position: absolute; inset-block: 0; inset-inline-start: 0;
    width: 0; border-radius: 8px;
    background: linear-gradient(to left, rgba(0, 82, 204, .13), rgba(61, 139, 255, .30));
    transition: width .8s cubic-bezier(.2, .7, .3, 1);
  }
  .tldot {
    position: absolute; top: 50%; inset-inline-start: 0;
    width: 15px; height: 15px; border-radius: 50%;
    background: var(--brand); border: 3px solid #fff;
    box-shadow: 0 1px 5px rgba(9, 30, 66, .35);
    transform: translate(50%, -50%) scale(0);
    transition: transform .4s cubic-bezier(.3, 1.4, .5, 1), inset-inline-start .8s cubic-bezier(.2, .7, .3, 1);
  }
  .tldot.on { transform: translate(50%, -50%) scale(1); }
  .tlrow.hire .tldot { background: var(--good); }
  .tlrow.hire .tlfill { background: linear-gradient(to left, rgba(10,122,82,.13), rgba(36,181,129,.3)); }
  .tlrow.hire .tlname { color: var(--good); }
  .tlname { font-weight: 600; font-size: 13.5px; }
  .tlcount { font-size: 11.5px; color: var(--faint); }
  .tlday { text-align: left; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 13.5px; }
  .tlday small { display: block; font-weight: 500; font-size: 10.5px; color: var(--faint); }
  .tlaxis {
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--faint);
    border-top: 1px dashed var(--line); padding-top: 5px;
    margin-top: 2px;
  }
  .tlaxis-wrap { display: grid; grid-template-columns: 148px 1fr 78px; gap: 12px; }
  .tlaxis-wrap > :first-child, .tlaxis-wrap > :last-child { min-height: 1px; }

  /* ---------- גרף 3: התפלגות מועדי גיוס ---------- */
  .bars { display: flex; flex-direction: column; gap: 9px; margin-top: 12px; }
  .bar-row {
    display: grid; grid-template-columns: 148px 1fr 62px;
    align-items: center; gap: 12px; font-size: 13px;
  }
  .bar-track { background: #eef1f6; border-radius: 999px; height: 22px; overflow: hidden; }
  .bar-fill {
    background: linear-gradient(90deg, #0a58c2, #4d9bff);
    height: 100%; width: 0; border-radius: 999px;
    transition: width .8s cubic-bezier(.2, .7, .3, 1);
  }
  .bar-val { text-align: left; font-variant-numeric: tabular-nums; font-weight: 700; }
  .bar-row.late { opacity: .5; }
  .bar-row.late .bar-fill { background: linear-gradient(90deg, #8a99ad, #b9c4d3); }

  .cohort { margin-bottom: 22px; }
  .cohort:last-child { margin-bottom: 0; }
  .cohort-title {
    font-size: 13px; font-weight: 700; color: var(--brand);
    background: var(--brand-soft); border-radius: 8px;
    padding: 6px 11px; margin-bottom: 4px;
  }

  /* ---------- הודעות ---------- */
  .msg { padding: 10px 13px; border-radius: 10px; font-size: 13.5px; margin-bottom: 7px; }
  .msg:last-child { margin-bottom: 0; }
  .msg.good { background: var(--good-soft); color: var(--good); }
  .msg.bad { background: var(--bad-soft); color: var(--bad); }
  .msg.flat { background: #f2f5f9; color: var(--muted); }
  .msg.warn { background: var(--warn-soft); color: var(--warn); }

  /* ---------- בסיס הנתונים ---------- */
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 9px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 11.5px; color: var(--muted); font-weight: 600; background: #f7f9fc; }
  td.num { font-variant-numeric: tabular-nums; }
  tr.nodata td { color: var(--warn); background: var(--warn-soft); white-space: normal; }
  .scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* ---------- טבלאות התוצאה ---------- */
  .mtable td.big { font-size: 15px; font-weight: 700; }
  .mtable td.hi { background: var(--brand-soft); }
  .mtable tr.hire td { background: var(--good-soft); font-weight: 600; }
  .mtable tr.late td { color: var(--bad); background: var(--bad-soft); }
  .mtable td.blocked { color: var(--bad); font-weight: 600; }
  .mtable td.stage { font-weight: 600; white-space: normal; }

  .hidden { display: none; }
  .foot { font-size: 12px; color: var(--muted); text-align: center; margin-top: 10px; }

  /* ---------- נייד ---------- */
  @media (max-width: 900px) {
    .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 680px) {
    .wrap { padding: 14px 11px 48px; }
    .card { padding: 16px 14px 18px; border-radius: 14px; margin-bottom: 12px; }
    h1 { font-size: 20px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .row { margin-top: 14px; }
    button { flex: 1; padding: 12px 16px; }

    .hero { padding: 20px 14px 18px; }
    .hero .big { font-size: 46px; }
    .sticky { margin: 0 -11px 12px; padding: 8px 13px; }
    .sticky .n { font-size: 19px; }

    /* השם עובר לשורה נפרדת, הפס והמספר נשארים יחד */
    .fstage, .tlrow, .bar-row, .tlaxis-wrap { grid-template-columns: 1fr 64px; gap: 4px 9px; }
    .fhead, .tlhead { grid-column: 1 / -1; }
    .tlaxis-wrap > :first-child { display: none; }
    .fval, .tlday, .bar-val { font-size: 14px; }
    .bar-row > :first-child { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
    .ftrack, .tltrack { height: 24px; }
  }
  @media (max-width: 360px) {
    .grid { grid-template-columns: 1fr; }
  }

  @media (prefers-reduced-motion: reduce) {
    .reveal, .fbar, .tlfill, .tldot, .bar-fill, .sticky { transition: none; }
    .reveal { opacity: 1; transform: none; }
  }

  /* ---------- כותרת עם הסבר בלחיצה ---------- */
  /* דרישה מפורשת: גוף העמוד מציג שם שלב וכמות בלבד. ההסבר - ממה נגזר
     המספר, מה שיעור המעבר, מה מקור היחסים - נפתח בלחיצה על ⓘ ואינו
     כתוב על המסך.                                                     */
  .titlerow { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .titlerow h1, .titlerow h2 { margin: 0; }
  .info {
    border: 1px solid var(--line); background: #f5f7fb; color: var(--muted);
    width: 22px; height: 22px; padding: 0; border-radius: 50%;
    font-size: 13px; line-height: 1; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background .15s, color .15s, border-color .15s;
  }
  .info:hover { background: var(--brand-soft); color: var(--brand); border-color: var(--brand-2); }
  .info.light {
    border-color: rgba(255, 255, 255, .4); background: rgba(255, 255, 255, .16);
    color: #fff; margin-top: 12px;
  }
  .fhead .info, .tlname .info, .barname .info, .cellname .info {
    width: 18px; height: 18px; font-size: 11px;
  }
  .tlname, .barname, .cellname { display: flex; align-items: center; gap: 6px; }

  /* ---------- חלון ההסבר ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 60; display: none;
    align-items: center; justify-content: center; padding: 18px;
    background: rgba(6, 25, 55, .5);
  }
  .modal.open { display: flex; }
  .modal .sheet {
    background: var(--card); border-radius: 16px; width: 100%;
    max-width: 560px; max-height: 80vh; overflow: auto;
    padding: 18px 20px 20px; box-shadow: 0 18px 50px rgba(6, 25, 55, .35);
  }
  .sheethead {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 10px; margin-bottom: 10px;
  }
  .sheethead h3 { margin: 0; font-size: 16px; }
  .sheet .x {
    background: #f1f4f9; color: var(--muted); border-radius: 9px;
    padding: 4px 10px; font-size: 13px; font-weight: 700; flex: none;
  }
  .sheet p {
    font-size: 13px; color: var(--muted); line-height: 1.65; margin: 0 0 10px;
  }
  .sheet p:last-child { margin-bottom: 0; }

  /* ---------- שורת מאזן קצרה ---------- */
  .tally {
    font-size: 13px; font-weight: 600; color: var(--brand);
    background: var(--brand-soft); border-radius: 9px;
    padding: 7px 11px; margin: 0 0 10px;
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="sticky" id="stickyBar">
    <span class="lbl" id="stickyLabel">התוצאה</span>
    <span class="n" id="stickyValue">0</span>
  </div>

  <div class="card">
    <div class="titlerow">
      <h1>מחשבון גיוס</h1>
      <button class="info" id="aboutBtn" type="button">ⓘ</button>
    </div>
    <p class="sub">כמה מועמדים צריך בכל שלב, וכמה מהם יתגייסו.</p>
  </div>

  <div class="card">
    <div class="titlerow">
      <h2>הנתונים שלך</h2>
      <button class="info" id="inputInfo" type="button">ⓘ</button>
    </div>
    <div class="grid" id="inputGrid"></div>
    <div class="row">
      <button class="primary" id="calcBtn">חשב</button>
      <button class="ghost" id="resetBtn">איפוס</button>
    </div>
  </div>

  <div id="results" class="hidden">
    <div class="card hero reveal" id="heroCard">
      <div class="cap" id="heroCap"></div>
      <div class="big" id="heroValue">0</div>
      <div class="note" id="heroNote"></div>
      <button class="info light" id="heroInfo" type="button">ⓘ</button>
    </div>

    <div class="card reveal" id="constraintCard">
      <div class="titlerow">
        <h2>כמה צריך כדי לגייס את היעד</h2>
        <button class="info" id="constraintInfo" type="button">ⓘ</button>
      </div>
      <div class="lanes" id="constraintLanes"></div>
      <div class="funnel" id="constraintBody"></div>
    </div>

    <div class="card reveal" id="gapCardPlan">
      <div class="titlerow">
        <h2>כמה עוד צריך</h2>
        <button class="info" id="gapPlanInfo" type="button">ⓘ</button>
      </div>
      <p class="tally" id="gapPlanSub"></p>
      <div class="funnel" id="gapPlanBody"></div>
      <div class="pick">
        <label for="gapEntry">נקודת הכניסה</label>
        <select id="gapEntry"></select>
      </div>
      <div class="funnel" id="gapPipeBody"></div>
    </div>

    <div class="card reveal" id="funnelCard">
      <div class="titlerow">
        <h2>כמה יגיעו לכל שלב</h2>
        <button class="info" id="funnelInfo" type="button">ⓘ</button>
      </div>
      <div class="funnel" id="funnelBody"></div>
    </div>

    <div class="card reveal" id="matrixCard">
      <div class="titlerow">
        <h2>כמה בכל שלב, ומתי</h2>
        <button class="info" id="matrixInfo" type="button">ⓘ</button>
      </div>
      <div class="scroller"><table class="mtable" id="matrixBody"></table></div>
    </div>

    <div class="card reveal" id="whenCard">

/* __ENGINE_START__ */
const Engine = (() => {
  const byKey = {};
  DATA.stages.forEach(s => { byKey[s.key] = s; });
  const TOL = DATA.gap_tolerance;
  const COVERAGE_FLOOR = DATA.coverage_warning_below;
  const SELECTIVE_FLOOR = DATA.selective_below;
  const HIRE = DATA.hire_key;

  // עיגול שמתנהג זהה בפייתון וב-JS. כל הערכים אינם שליליים.
  const roundHalfUp = x => Math.floor(x + 0.5);

  // עיגול למספר ספרות. נחוץ כדי שממוצעים משוקללים לא יתפצלו מול פייתון.
  const roundTo = (x, places) => {
    const f = Math.pow(10, places);
    return Math.floor(x * f + 0.5) / f;
  };

  const stage = k => {
    if (!(k in byKey)) throw new Error("שלב לא מוכר: " + k);
    return byKey[k];
  };

  const hasRate = k => {
    const s = stage(k);
    return s.has_data && s.hire_rate !== null;
  };

  const rate = k => hasRate(k) ? stage(k).hire_rate.mid : null;

  const coverage = k => hasRate(k) ? stage(k).hire_coverage : null;

  // הכיסוי בחלון שבו הקטיעה משמאל כבר אינה פועלת
  const coveredShare = k => {
    const c = coverage(k);
    if (c === null || c === undefined) return null;
    return c.covered !== null && c.covered !== undefined ? c.covered : c.overall;
  };

  const lowCoverage = (keys) => {
    if (!COVERAGE_FLOOR) return [];
    const out = [];
    (keys === undefined || keys === null ? stageKeys() : keys).forEach(k => {
      if (!hasRate(k)) return;
      const share = coveredShare(k);
      if (share !== null && share < COVERAGE_FLOOR) {
        const c = coverage(k);
        out.push({ key: k, label: label(k), share: share,
                   covered_n: c.covered_n, covered_hires: c.covered_hires,
                   overall: c.overall, hires: c.hires });
      }
    });
    return out;
  };

  const stageKeys = (withDataOnly) =>
    DATA.stages.filter(s => !withDataOnly || (s.has_data && s.hire_rate)).map(s => s.key);

    }];

    forward(k).forEach(f => {

        key: f.key, label: f.label,
        count: roundHalfUp(count * f.reach.mid),
        reach: f.reach.mid,
        days_median: f.days.median, days_mean: f.days.mean,
        is_source: false, is_hire: f.key === HIRE
      });
    });

    return {
      stage: k, label: stage(k).label, count: count, steps: steps,

    };

    const s = stage(k);
    if (!s.buckets) return null;

    return s.buckets.map(b => ({

      hires: b.share === null ? null : roundHalfUp(hires * b.share)
    }));
  };

    const cohorts = [];
    stageKeys().forEach(k => {
      const n = counts[k];
      if (n === undefined || n === null || !hasRate(k)) return;
      cohorts.push(projectCohort(k, n));
    });

    const perStage = {};
    const order = [];
    cohorts.forEach(c => {
      c.steps.forEach(step => {
        if (!(step.key in perStage)) {
          perStage[step.key] = { key: step.key, label: step.label, total: 0, sources: [] };
          order.push(step.key);
        }
        const entry = perStage[step.key];
        entry.total += step.count;
        entry.sources.push({
          from: c.stage, from_label: c.label, from_count: c.count,
          count: step.count, days_median: step.days_median
        });
      });
    });

    return {
      cohorts: cohorts,
      per_stage: order.map(k => perStage[k]),
      hires: (perStage[HIRE] || { total: 0 }).total,
      overlap_warning: cohorts.length > 1
    };
  };

  /* איזה חלק מהמגויסים מאותו שלב כבר התגייס בתוך מספר ימים נתון.
     נקרא מהעקומה המדודה שנבנתה יום ביום מקובצי המקור, ולא מחלונות
     הזמן, כדי שתאריך שנופל באמצע חלון יקבל תשובה מדודה. */
  const curveShare = (k, days) => {
    if (days === null || days === undefined || !hasRate(k)) return null;
    const curve = stage(k).hire_curve;
    if (!curve) return null;
    let share = 0.0;
    for (let i = 0; i < curve.length; i++) {
      if (curve[i][0] <= days) share = curve[i][1];
      else break;
    }
    return share;
  };

  /* כמה מהקבוצה יתגייסו בתוך מספר ימים. זו תת-קבוצה של הגיוסים
     הצפויים בסך הכול, ולא מספר אחר. */
  const hiresByDay = (k, count, days) => {
    if (count === null || days === null || days === undefined || !hasRate(k))
      return null;
    const share = curveShare(k, days);
    if (share === null) return null;
    return roundHalfUp(count * rate(k) * share);
  };

  const combinedByDay = (counts, days) => {
    if (days === null || days === undefined) return null;
    const result = combine(counts);
    const sources = [];
    let total = 0;
    result.cohorts.forEach(c => {
      const n = hiresByDay(c.stage, c.count, days);
      if (n === null) return;
      total += n;
      sources.push({
        from: c.stage, from_label: c.label, from_count: c.count,
        hires: n, eventual: c.hires, share: curveShare(c.stage, days)
      });
    });
    if (!sources.length) return null;
    return { days: days, hires: total, eventual: result.hires, sources: sources };
  };

  /* מתי צפויים להגיע לכל שלב - שורה אחת לכל שלב, לכל הקבוצות יחד.
     המשתמש ביקש גרף אחד ולא גרף לכל שלב שהוזן. הכמות היא סכום ההגעות,
     והזמן הוא ממוצע משוקלל של חציוני הימים לפי מספר המועמדים.
     שלב שהוזן ידנית אינו נספר בעצמו - מי שכבר שם אינו "מגיע" לשם. */
  const combinedWhen = (counts) => {
    const result = combine(counts);
    const rows = [];
    result.per_stage.forEach((entry, idx) => {
      const parts = entry.sources.filter(x => x.from !== entry.key);
      if (!parts.length) return;
      const total = parts.reduce((a, x) => a + x.count, 0);
      let days;
      if (total) {
        days = roundTo(parts.reduce((a, x) => a + x.count * x.days_median, 0) / total, 1);
      } else {
        // כל הקבוצות תורמות אפס. אין משקל, ולכן ממוצע פשוט.
        days = roundTo(parts.reduce((a, x) => a + x.days_median, 0) / parts.length, 1);
      }
      rows.push({
        key: entry.key, label: entry.label, count: total,
        days_median: days, weighted: parts.length > 1,
        is_hire: entry.key === HIRE, sources: parts, order: idx
      });
    });
    rows.sort((a, b) => (a.days_median - b.days_median) || (a.order - b.order));
    rows.forEach(r => { delete r.order; });
    return rows;
  };

  /* מתי צפויים להתגייס - חלון זמן אחד לכל הקבוצות יחד. כל קבוצה מפזרת
     את המגויסים שלה לפי התפלגות השלב שלה, והשורות נסכמות. */
  const combinedTimeline = (counts) => {
    const result = combine(counts);
    let rows = null;
    result.cohorts.forEach(c => {
      const tl = timeline(c.stage, c.count);
      if (tl === null) return;
      if (rows === null) {
        rows = tl.map(b => ({ key: b.key, label: b.label, share: 0.0,
                              hires: 0, sources: [] }));
      }
      tl.forEach((b, i) => {
        if (b.hires === null) return;
        rows[i].hires += b.hires;
        rows[i].sources.push({
          from: c.stage, from_label: c.label, from_count: c.count,
          hires: b.hires, share: b.share
        });
      });
    });
    if (rows === null) return null;
    const total = rows.reduce((a, r) => a + r.hires, 0);
    rows.forEach(r => { r.share = total ? roundTo(r.hires / total, 6) : 0.0; });
    return { rows: rows, total: total, buckets: rows.length };
  };

  // פיזור כמות אחת על חלונות הזמן, בלי שהעיגול יאבד או ימציא אנשים.
  // העיגול נעשה על הסכום הרץ, ולכן סכום התאים שווה בדיוק לסך הכול.
  const spread = (total, buckets) => {
    const out = [];
    let acc = 0.0, done = 0;
    (buckets || []).forEach(b => {
      const share = b.share;
      acc += (share === null || share === undefined) ? 0.0 : total * share;
      const v = roundHalfUp(acc) - done;
      done += v;
      out.push({ key: b.key, label: b.label, share: share, count: v });
    });
    return out;
  };

  // טבלה אחת: כמה יגיעו לכל שלב, ומתי, על אותה רשת חלונות זמן.
  const combinedMatrix = (counts) => {
    const result = combine(counts);
    const rows = {};
    const order = [];
    result.cohorts.forEach(c => {
      forward(c.stage).forEach(f => {
        const key = f.key;
        if (!(key in rows)) {
          rows[key] = {
            key: key, label: f.label, total: 0, weighted: 0.0,
            cells: null, sources: [], is_hire: key === HIRE,
            order: order.length
          };
          order.push(key);
        }
        const r = rows[key];
        const arrivals = roundHalfUp(c.count * f.reach.mid);
        r.total += arrivals;
        r.weighted += arrivals * f.days.median;
        const cells = spread(arrivals, f.buckets);
        if (r.cells === null) {
          r.cells = cells.map(x => ({ key: x.key, label: x.label, count: 0 }));
        }
        cells.forEach((x, i) => { r.cells[i].count += x.count; });
        r.sources.push({
          from: c.stage, from_label: c.label, from_count: c.count,
          count: arrivals, reach: f.reach.mid, days_median: f.days.median,
          cells: cells
        });
      });
    });

    const out = order.map(key => {
      const r = rows[key];
      const n = r.sources.length;
      let days;
      if (r.total) {
        days = roundTo(r.weighted / r.total, 1);
      } else {
        let sum = 0;
        r.sources.forEach(x => { sum += x.days_median; });
        days = roundTo(sum / n, 1);
      }
      return {
        key: r.key, label: r.label, count: r.total, days_median: days,
        weighted: n > 1, is_hire: r.is_hire, cells: r.cells,
        sources: r.sources, order: r.order
      };
    });

    out.sort((a, b) => (a.days_median - b.days_median) || (a.order - b.order));
    out.forEach(r => { delete r.order; });
    return {
      buckets: DATA.time_buckets.map(b => ({
        key: b.key, label: b.label, min_days: b.min_days, max_days: b.max_days
      })),
      rows: out,
      overlap_warning: result.overlap_warning
    };
  };

  const crossCheck = (counts) => {
    const entered = stageKeys().filter(
      k => counts[k] !== undefined && counts[k] !== null && hasRate(k));
    const out = [];
    for (let i = 0; i < entered.length; i++) {
      const early = entered[i];
      const projection = projectCohort(early, counts[early]);
      const byStep = {};
      projection.steps.forEach(s => { byStep[s.key] = s; });
      for (let j = i + 1; j < entered.length; j++) {
        const late = entered[j];
        if (!(late in byStep)) continue;
        const expected = byStep[late].count;
        const actual = counts[late];
        const allowed = Math.max(TOL.min_candidates, expected * TOL.pct);
        let verdict;
        if (Math.abs(actual - expected) <= allowed) verdict = "matches";
        else if (actual < expected) verdict = "fewer";
        else verdict = "more";
        out.push({
          early: early, late: late, early_count: counts[early],
          expected: expected, actual: actual,
          gap: Math.abs(actual - expected), verdict: verdict
        });
      }
    }
    return out;
  };

  const requiredForTarget = (k, target) => {
    if (target === null || !hasRate(k)) return null;
    return target / rate(k);
  };

  const requiredFunnel = (target) => {
    const out = {};
    stageKeys().forEach(k => {
      const req = requiredForTarget(k, target);
      out[k] = req === null ? null : { value: roundHalfUp(req), source: "derived" };
    });
    out.hires = target;
    return out;
  };

  /* שיעור הגיוס שאפשר לממש בזמן שנותר. מי שיתגייס אחרי התאריך
     אינו עונה על היעד, ולכן אינו נספר. */
  const effectiveRate = (k, days) => {
    if (!hasRate(k)) return null;
    if (days === null || days === undefined) return rate(k);
    const share = curveShare(k, days);
    return share === null ? null : rate(k) * share;
  };

  /* הקוהורט הגדול ביותר שנמדד אי פעם בשלב. אמת מידה לדרישה ענקית. */
  const observedCandidates = (k) => {
    if (!hasRate(k)) return null;
    const o = stage(k).observed;
    return o === null || o === undefined ? null : o.candidates;
  };

  const observedPerDay = (k) => {
    if (!hasRate(k)) return null;
    const o = stage(k).observed;
    return o === null || o === undefined ? null : o.per_day;
  };

  // תקרה אמיתית קיימת רק כשיש חלון זמן. בלי תאריך יעד אין תקרה:
  // «4,000 גיוסים» בלי מועד הוא יעד לגיטימי, הוא פשוט לוקח יותר זמן.
  const capacity = (k, days) => {
    if (days === null || days === undefined || !hasRate(k)) return null;
    const pd = observedPerDay(k);
    return pd === null ? null : pd * days;
  };

  // המחיר בזמן, במקום פסילה: כמה ימים של הקצב הנמדד דרושים לכמות הזו
  const paceDays = (k, required) => {
    if (required === null || required === undefined || !hasRate(k)) return null;
    const pd = observedPerDay(k);
    if (!pd) return null;
    return roundTo(required / pd, 1);
  };

  /* שורות הדרישה - מקור האמת היחיד. משמש גם את requiredPlan וגם את
     gapPlan. בעבר היו שני מימושים ורק אחד התחשב בזמן, וכך «400
     גיוסים תוך חודש» החזיר 5,205 בדיקות קבצים - כמות שמניבה כ-13
     גיוסים בחודש ולא 400. */
  const requirementRows = (needed, days) => stageKeys().map(k => {
    const st = stage(k);
    if (!hasRate(k)) {
      return { key: k, label: st.label, has_data: false, rate: null,
               share_in_time: null, effective_rate: null, required: null,
               in_time: false, feasible: false,
               lead_days_median: null, lead_days_mean: null,
               measured_on: null, observed: null, observed_per_day: null,
               capacity: null, pace_days: null, note: st.note };
    }
    const d = st.days_to_hire;
    const share = (days === null || days === undefined) ? 1.0 : curveShare(k, days);
    const eff = rate(k) * share;
    let required;
    if (needed <= 0) required = 0;
    else if (eff > 0) required = roundHalfUp(needed / eff);
    else required = null;
    const observed = observedCandidates(k);
    const cap = capacity(k, days);
    // דרישה נפסלת רק כשיש חלון זמן שאינו יכול להכיל אותה, לפי הקצב
    // הנמדד. בלי תאריך יעד אין תקרה - הדרישה פשוט לוקחת זמן.
    let feasible;
    if (required === null) feasible = false;
    else if (required === 0 || cap === null) feasible = true;
    else feasible = required <= cap;
    return {
      key: k, label: st.label, has_data: true, rate: rate(k),
      share_in_time: share, effective_rate: eff, required: required,
      in_time: eff > 0, feasible: feasible,
      lead_days_median: d.median, lead_days_mean: d.mean,
      measured_on: d.n, observed: observed,
      observed_per_day: observedPerDay(k),
      capacity: cap === null ? null : roundHalfUp(cap),
      pace_days: paceDays(k, required),
      note: ""
    };
  });

  const feasibleStages = (target, days) => {
    const plan = requiredPlan(target, days);
    return plan === null ? []
      : plan.rows.filter(r => r.has_data && r.feasible).map(r => r.key);
  };

  const requiredPlan = (target, days) => {
    if (target === null || target === undefined) return null;
    if (days === undefined) days = null;
    return { target: target, days: days, rows: requirementRows(target, days) };
  };

  /* שלבים שמהם הדרך לגיוס ארוכה יותר מאשר משלב מוקדם יותר. הזמנים
     נמדדים רק על מי שהתגייס בפועל, והקבוצה בכל שלב אחרת, ולכן הזמן
     אינו יורד בהכרח לאורך התהליך. המשמעות: התאריך הנדרש בכל שלב אינו
     בסדר השלבים, וצריך לומר את זה במפורש. */
  const leadTimeAnomalies = () => {
    const ordered = stageKeys().filter(hasRate);
    const out = [];
    for (let i = 1; i < ordered.length; i++) {
      const key = ordered[i];
      const lead = stage(key).days_to_hire.median;
      for (let j = 0; j < i; j++) {
        const prev = ordered[j];
        const prevLead = stage(prev).days_to_hire.median;
        if (lead > prevLead) {
          out.push({
            key: key, label: stage(key).label, lead_days_median: lead,
            earlier: prev, earlier_label: stage(prev).label,
            earlier_lead_days_median: prevLead
          });
        }
      }
    }
    return out;
  };

  /* משפך רציף אחד: מה צריך בשלב הכניסה, ומה יזרום ממנו לכל שלב הלאה.
     הכמות הנדרשת מחושבת מהיעד, ומשם הכול נגזר קדימה בדיוק כמו
     projectCohort - כך שהזנת המספר הנדרש במחשבון הרגיל תיתן אותו משפך.
     בגלל העיגול, hires עשוי להיות שונה מהיעד במגויס או שניים. */
  const planFromTarget = (k, target, days) => {
    if (target === null || target === undefined || !hasRate(k)) return null;
    if (days === undefined) days = null;
    const st = stage(k);
    const d = st.days_to_hire;
    const eff = effectiveRate(k, days);
    if (!eff) {
      return {
        stage: k, label: st.label, target: target, required: null, exact: null,
        rate: rate(k), effective_rate: eff, share_in_time: curveShare(k, days),
        days: days, lead_days_median: d.median, lead_days_mean: d.mean,
        measured_on: d.n, observed: observedCandidates(k),
        observed_per_day: observedPerDay(k),
        capacity: capacity(k, days) === null ? null
                  : roundHalfUp(capacity(k, days)),
        pace_days: null, feasible: false,
        projection: null, hires: 0, hires_in_time: 0
      };
    }
    const exact = target / eff;
    const required = roundHalfUp(exact);
    const projection = projectCohort(k, required);
    const observed = observedCandidates(k);
    const cap = capacity(k, days);
    return {
      stage: k, label: st.label, target: target, required: required,
      exact: roundTo(exact, 1), rate: rate(k), effective_rate: eff,
      share_in_time: days === null ? 1.0 : curveShare(k, days), days: days,
      lead_days_median: d.median, lead_days_mean: d.mean, measured_on: d.n,
      observed: observed, observed_per_day: observedPerDay(k),
      capacity: cap === null ? null : roundHalfUp(cap),
      pace_days: paceDays(k, required),
      feasible: cap === null || required <= cap,
      projection: projection,
      // בסך הכול, בלי הגבלת זמן. כשיש תאריך יעד זהו מספר אחר מהיעד.
      hires: projection.hires,
      // מה שבאמת עונה על היעד
      hires_in_time: days === null ? projection.hires
                                   : hiresByDay(k, required, days)
    };
  };

  /* כמה עוד צריך, אחרי שסופרים את מי שכבר נמצא בתהליך.
     בלי זה המחשבון דורש להתחיל הכול מאפס ומנפח את הדרישה. */
  const gapPlan = (counts, target, days) => {
    if (target === null || target === undefined) return null;
    if (days === undefined) days = null;

    let have, sources;
    if (days === null) {
      const c = combine(counts);
      have = c.hires;
      sources = c.cohorts.map(x => ({
        from: x.stage, from_label: x.label,
        from_count: x.count, hires: x.hires
      }));
    } else {
      const bd = combinedByDay(counts, days);
      have = bd === null ? 0 : bd.hires;
      sources = bd === null ? [] : bd.sources;
    }
    const gap = target - have;

    const rows = requirementRows(gap, days);

    return { target: target, have: have, gap: gap, days: days,
             sources: sources, rows: rows };
  };

  // הלוח של מנהלת הגיוס: כמה צריך בכל שלב, ועד מתי.
  // required_now - כמה צריך היום, מוגבל בזמן שנותר.
  // required_by  - כמה צריך שיעמדו בשלב, ותאריך היעד שלהם.
  const managerPlan = (counts, target, days) => {
    const plan = gapPlan(counts || {}, target, days);
    if (plan === null) return null;
    const needed = plan.gap;
    const dd = (days === null || days === undefined) ? null : days;

    const rows = plan.rows.map(r => {
      const row = Object.assign({}, r);
      row.required_now = r.required;
      if (!r.has_data) {
        row.required_by = null;
        row.required_by_feasible = false;
        row.deadline_days = null;
        row.late = false;
        return row;
      }
      let requiredBy;
      if (needed <= 0) requiredBy = 0;
      else if (r.rate) requiredBy = roundHalfUp(needed / r.rate);
      else requiredBy = null;

      // required_by אינו מוגבל בזמן מעצם הגדרתו - הוא הכמות שצריכה
      // לעמוד בשלב כשיגיע תורה. לכן אין לו תקרה, ורק המחיר בזמן מלווה אותו.
      row.required_by = requiredBy;
      row.required_by_feasible = requiredBy !== null;
      row.required_by_pace_days = paceDays(r.key, requiredBy);
      row.deadline_days = dd === null ? null :
        roundTo(dd - r.lead_days_median, 1);
      row.late = row.deadline_days !== null && row.deadline_days < 0;
      return row;
    });

    return {
      target: plan.target, have: plan.have, gap: plan.gap, days: dd,
      sources: plan.sources, rows: rows
    };
  };

  /* כמה צריך שיעברו בכל שלב כדי לגייס X - לפי המשפך שנמדד בפועל.
     שונה מ-requiredPlan: שם השיעור נמדד על קוהורט ומכסה רק כמחצית
     מהגיוסים, וכאן המדידה היא של הארגון כולו. הכמות פרופורציונלית
     ליעד בלבד; הזמן קובע רק את הקצב הנדרש.                          */
  const throughputPlan = (target, days) => {
    if (target === null || target === undefined) return null;
    if (days === undefined) days = null;
    const base = DATA.hire_observed;
    if (!base || !base.candidates) return null;

    const factor = target / base.candidates;
    const rows = stageKeys().map(k => {
      const st = stage(k);
      if (!hasRate(k) || !st.observed) {
        return { key: k, label: st.label, has_data: false, observed: null,
                 required: null, per_day: null, observed_per_day: null,
                 pace: null, coverage: null, selective: false, note: st.note };
      }
      const o = st.observed;
      const required = roundHalfUp(o.candidates * factor);
      const perDay = !days ? null : roundTo(required / days, 2);
      const pace = (perDay === null || !o.per_day) ? null
                 : roundTo(perDay / o.per_day, 2);
      const share = coveredShare(k);
      return {
        key: k, label: st.label, has_data: true,
        observed: o.candidates, observed_days: o.days,
        observed_per_day: o.per_day, required: required,
        per_day: perDay, pace: pace, coverage: share,
        selective: !!(share !== null && SELECTIVE_FLOOR &&
                      share < SELECTIVE_FLOOR),
        note: ""
      };
    });

    return {
      target: target, days: days, factor: roundTo(factor, 4),
      observed_hires: base.candidates, observed_days: base.days,
      observed_from: base.first_date, observed_to: base.last_date,
      rows: rows
    };
  };

  const annualFlow = () => DATA.annual_flow || null;

  /* המחשבון עם האילוצים. התשובה הראשית לשאלת התכנון.
     שני נתיבים: «אוכלוסייה מוכרת» קבועה שאינה עוברת מיון ואינה גדלה,
     ו«אוכלוסייה חדשה» שהיא היחידה שנגזרת מכמות ההגשות. היחסים באים
     מתרשים תזרים 2025 ולא מקבצי הפעילויות, שרישומם חסר.
     ההסבר המלא נמצא ב-recruit_calc/engine.py. */
  const constrainedPlan = (target, days) => {
    const af = annualFlow();
    if (af === null || target === null || target === undefined) return null;
    if (days === undefined) days = null;
    const year = af.year_days;
    const span = days === null ? year : days;
    if (span === null || span <= 0) return null;

    const knownHires = af.known.hires_per_year * span / year;
    let newHires = target - knownHires;
    const shortfall = newHires < 0;
    if (shortfall) newHires = 0.0;

    const chain = af.chain;
    const volumes = {};
    volumes[af.hire_row.key] = newHires;
    let v = newHires;
    for (let i = chain.length - 1; i >= 0; i--) {
      const r = chain[i].rate_to_next;
      if (!r) return null;
      v = v / r;
      volumes[chain[i].key] = v;
    }

    const make = (row, isHire) => {
      const n = volumes[row.key];
      const kn = row.known_passes ? knownHires : 0.0;
      const newI = roundHalfUp(n);
      const knownI = roundHalfUp(kn);
      const basePerDay = row.volume / year;
      const perDay = (newI + knownI) / span;
      return {
        key: row.key, label: row.label, is_hire: isHire,
        total: newI + knownI, new: newI, known: knownI,
        known_passes: row.known_passes,
        rate_to_next: row.rate_to_next, to_next: row.to_next,
        baseline: row.volume, baseline_new: row.new,
        baseline_known: row.known,
        baseline_per_day: roundTo(basePerDay, 3),
        per_day: roundTo(perDay, 3),
        pace: !basePerDay ? null : roundTo(perDay / basePerDay, 3)
      };
    };

    const rows = chain.map(r => make(r, false));
    rows.push(make(af.hire_row, true));

    const aside = af.aside.map(a => {
      const total = roundHalfUp(volumes[a.after] * a.share_of_host);
      const basePerDay = a.volume / year;
      const perDay = total / span;
      return {
        key: a.key, label: a.label, after: a.after, total: total,
        share_of_host: a.share_of_host, baseline: a.volume,
        baseline_per_day: roundTo(basePerDay, 3),
        per_day: roundTo(perDay, 3),
        pace: !basePerDay ? null : roundTo(perDay / basePerDay, 3)
      };
    });

    const top = rows[0];
    return {
      target: target, days: days, span_days: span, annual: days === null,
      source: af.source, year: af.year, shortfall: shortfall,
      known: {
        label: af.known.label, hires: roundHalfUp(knownHires),
        per_year: af.known.hires_per_year, ratio: af.known.ratio,
        share: !target ? null : roundTo(knownHires / target, 4)
      },
      new: {
        label: af.new.label, hires: roundHalfUp(newHires),
        per_year: af.new.hires_per_year, ratio: af.new.ratio_measured,
        hire_rate: af.new.hire_rate,
        share: !target ? null : roundTo(newHires / target, 4)
      },
      submissions: top.total,
      baseline_submissions: top.baseline,
      baseline_hires: af.hires,
      // שתי הצמיחות מול אותו חלון. ראו את ההסבר ב-engine.py.
      baseline_in_span: roundHalfUp(top.baseline * span / year),
      baseline_hires_in_span: roundHalfUp(af.hires * span / year),
      growth: top.pace,
      target_growth: rows[rows.length - 1].pace,
      rows: rows, aside: aside
    };
  };

  const gapPipeline = (counts, target, k, days) => {
    const plan = gapPlan(counts, target, days);
    if (plan === null || !hasRate(k)) return null;
    const row = plan.rows.filter(r => r.key === k)[0];
    if (plan.gap <= 0 || !row.in_time || row.required === null) {
      return { plan: plan, stage: k, label: stage(k).label,
               required: row.required, projection: null };
    }
    return { plan: plan, stage: k, label: stage(k).label,
             required: row.required,
             projection: projectCohort(k, row.required) };
  };

  const targetVerdict = (projected, target) => {
    if (target === null || target === undefined) return null;
    const allowed = Math.max(TOL.min_candidates, target * TOL.pct);
    let kind, gap;
    if (Math.abs(projected - target) <= allowed) { kind = "target_ok"; gap = 0; }
    else if (projected < target) { kind = "target_miss"; gap = target - projected; }
    else { kind = "target_over"; gap = projected - target; }
    return { kind: kind, gap: gap, projected: projected, target: target };
  };

  return { stage, hasRate, rate, label, stageKeys, forward, roundHalfUp, roundTo,
           coverage, coveredShare, lowCoverage,
           projectCohort, timeline, combine, combinedWhen, combinedTimeline,
           spread, combinedMatrix, managerPlan, throughputPlan,
           annualFlow, constrainedPlan,
           curveShare, hiresByDay, combinedByDay,
           crossCheck, requiredForTarget, requiredFunnel, requiredPlan,
           effectiveRate, observedCandidates, observedPerDay, capacity,
           paceDays, feasibleStages,
           leadTimeAnomalies, planFromTarget, gapPlan, gapPipeline,
           targetVerdict };
})();
/* __ENGINE_END__ */
/* ------------------------------------------------------------------ *
 *  ממשק המשתמש                                                        *
 *                                                                     *
 *  גוף העמוד מציג שם שלב וכמות בלבד. כל ההסבר - ממה נגזר המספר, מה     *
 *  שיעור המעבר, מה מקור היחסים ומה מגבלות הנתונים - יושב בחלון שנפתח   *
 *  בלחיצה על ⓘ. שום מספר אינו מאבד את המקור שלו: המקור רק אינו נכתב   *
 *  בגוף העמוד. נתוני האמת הגולמיים (כמה נמדדו בפועל בכל שלב, כמה שורות *
 *  בקבצים, טבלת המעברים המלאה) אינם מוצגים בעמוד כלל.                  *
 * ------------------------------------------------------------------ */
const $ = id => document.getElementById(id);
const nf = n => n.toLocaleString("he-IL");
const pct = x => (x * 100).toFixed(1) + "%";
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};

/* --- תאריכים. לא חלק ממנוע החישוב: המנוע מחזיר ימים, וכאן הם הופכים
   לתאריך. לכן אין כאן דרישת תאימות מול פייתון. --- */
function parseDay(raw) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(raw || "").trim());
  if (!m) return null;
  const y = Number(m[1]), mo = Number(m[2]), day = Number(m[3]);
  const d = new Date(y, mo - 1, day);
  if (isNaN(d.getTime())) return null;
  // ל-31 בספטמבר אין קיום, ו-new Date מגלגל אותו בשקט ל-1 באוקטובר.
  // בלי הבדיקה הזו תאריך שגוי היה מתקבל כאילו כלום.
  if (d.getFullYear() !== y || d.getMonth() !== mo - 1 || d.getDate() !== day)
    return null;
  return d;
}
function shiftDays(base, days) {
  const out = new Date(base.getFullYear(), base.getMonth(), base.getDate());
  out.setDate(out.getDate() + Math.round(days));
  return out;
}
function fmtDay(d) {
  return d.getDate() + "." + (d.getMonth() + 1) + "." + d.getFullYear();
}
function daysBetween(from, to) {
  return Math.round((to.getTime() - from.getTime()) / 86400000);
}
function todayDay() {
  const n = new Date();
  return new Date(n.getFullYear(), n.getMonth(), n.getDate());
}

const REDUCED = typeof matchMedia === "function" &&
                matchMedia("(prefers-reduced-motion: reduce)").matches;
const CAN_ANIMATE = !REDUCED && typeof requestAnimationFrame === "function";

function countUp(node, to, duration) {
  if (!CAN_ANIMATE) { node.textContent = nf(to); return; }
  const start = performance.now();
  const step = now => {
    const t = Math.min(1, (now - start) / duration);
    node.textContent = nf(Math.round(to * (1 - Math.pow(1 - t, 3))));
    if (t < 1) requestAnimationFrame(step); else node.textContent = nf(to);
  };
  requestAnimationFrame(step);
}

function later(fn, delay) {
  if (!CAN_ANIMATE) { fn(); return; }
  setTimeout(fn, delay);
}

/* ------------------------------------------------------------------ *
 *  ההסבר בלחיצה                                                       *
 *  כל ⓘ נושא את הטקסט שלו ב-data-info, כדי שאפשר יהיה לבדוק שאף מספר   *
 *  לא נשאר בלי מקור גם כשהמקור אינו כתוב על המסך.                      *
 * ------------------------------------------------------------------ */
const INFO = {};

function paras(text) {
  return (Array.isArray(text) ? text : [text]).filter(t => t);
}

function openInfo(title, text) {
  $("infoTitle").textContent = title;
  const body = $("infoText");
  body.innerHTML = "";
  paras(text).forEach(t => body.append(el("p", null, t)));
  $("infoModal").classList.add("open");
}

function closeInfo() { $("infoModal").classList.remove("open"); }

function infoBtn(title, text) {
  const b = el("button", "info", "ⓘ");
  b.setAttribute("type", "button");
  b.setAttribute("title", "הסבר");
  b.setAttribute("data-info", paras(text).join(" "));
  b.addEventListener("click", () => openInfo(title, text));
  return b;
}

/* כפתור קבוע שיושב ב-HTML. הטקסט שלו מתחלף בכל חישוב, ולכן הוא נשמר
   במפה במקום להוסיף מאזין נוסף בכל פעם. */
function setInfo(id, title, text) {
  INFO[id] = { title: title, text: text };
  $(id).setAttribute("data-info", paras(text).join(" "));
}

function attachInfo(id) {
  $(id).addEventListener("click", () => {
    const rec = INFO[id];
    if (rec) openInfo(rec.title, rec.text);
  });
}

/* --- שדות הקלט --- */
function makeField(key, labelText, extraClass, hintText, type) {
  const wrap = el("div", "field" + (extraClass ? " " + extraClass : ""));
  const lab = el("label", null, labelText);
  lab.setAttribute("for", "in_" + key);
  const inp = el("input");
  inp.id = "in_" + key;
  inp.type = type || "number";
  if (!type) { inp.min = "0"; inp.placeholder = "—"; }
  wrap.append(lab, inp);
  if (hintText) wrap.append(el("span", "hint", hintText));
  return wrap;
}

function buildInputs() {
  const grid = $("inputGrid");
  DATA.stages.forEach(s => {
    grid.append(makeField(s.key, s.label,
      s.has_data ? "" : "no-data",
      s.has_data ? "" : "אין נתונים"));
  });
  grid.append(makeField("target", "יעד גיוס", "target", ""));
  grid.append(makeField("targetDate", "תאריך היעד", "when", "", "date"));
}

/* בורר נקודת הכניסה להשלמה. רק שלבים שיש להם נתונים במקור. */
function buildGapEntry() {
  const sel = $("gapEntry");
  Engine.stageKeys(true).forEach(k => {
    const opt = el("option", null, Engine.stage(k).label);
    opt.value = k;
    sel.append(opt);
  });
  sel.value = Engine.stageKeys(true)[0];
}

function readInputs() {
  const counts = {};
  DATA.stages.forEach(s => {
    const raw = $("in_" + s.key).value.trim();
    const n = raw === "" ? null : Number(raw);
    counts[s.key] = Number.isFinite(n) ? n : null;
  });
  const rawT = $("in_target").value.trim();
  const t = rawT === "" ? null : Number(rawT);
  const rawDate = String($("in_targetDate").value || "").trim();
  return {
    counts: counts,
    target: Number.isFinite(t) ? t : null,
    targetDate: parseDay(rawDate),
    // תאריך שהוזן ולא נקרא. בלי זה הוא היה נבלע בשקט.
    badDate: rawDate !== "" && parseDay(rawDate) === null ? rawDate : null
  };
}

/* --- תיאור מקור הגזירה, כדי שלא יהיה ספק ממה נגזר כל מספר --- */
function sourceText(sources) {
  return sources.map(s =>
    s.from === undefined || s.count === s.from_count
      ? "הוזן ידנית"
      : nf(s.count) + " מתוך " + nf(s.from_count) + " ב«" + s.from_label + "»"
  ).join("  +  ");
}

/* --- כרטיס התוצאה --- */
function renderHero(cap, value, note, infoTitle, infoText) {
  $("heroCap").textContent = cap;
  $("heroNote").textContent = note;
  countUp($("heroValue"), value, 900);
  $("stickyLabel").textContent = cap;
  $("stickyValue").textContent = nf(value);
  setInfo("heroInfo", infoTitle, infoText);
}

/* --- שורת שלב: שם, ⓘ, אחוז, פס, כמות. ותו לא. --- */
function stageHead(label, infoTitle, infoText, chip, chipCls) {
  const head = el("div", "fhead");
  head.append(el("span", "fname", label));
  if (infoText) head.append(infoBtn(infoTitle || label, infoText));
  if (chip) head.append(el("span", chipCls || "fpct", chip));
  return head;
}

/* --- גרף 1: כמה צפויים בכל שלב --- */
/* denom - הכמות שממנה הכול נגזר, כשיש קבוצה אחת בלבד. אז אפשר להציג
   אחוז בעל משמעות. כשיש כמה קבוצות אין מכנה משותף, ולא מוצג אחוז. */
function renderFunnel(entries, manual, denom) {
  const body = $("funnelBody");
  body.innerHTML = "";
  const max = Math.max.apply(null, entries.map(e => e.total).concat([1]));

  // שלבים ללא נתונים נרשמים במקומם בסדר התהליך, ולא מוערכים
  DATA.stages.forEach(s => {
    if (s.has_data) return;
    const row = el("div", "fstage nodata");
    row.append(stageHead(s.label, s.label, manual[s.key] !== null
        ? "הוזן ידנית. אין במקור נתוני המרה לשלב הזה, ולכן לא נגזר ממנו דבר."
        : "אין מקור נתונים לשלב הזה."),
      el("div", "ftrack"),
      el("div", "fval", manual[s.key] !== null ? nf(manual[s.key]) : "—"));
    body.append(row);
  });

  entries.forEach((entry, i) => {
    const isHire = entry.key === DATA.hire_key;
    const isSource = !isHire && entry.sources.some(s => s.from === entry.key);

    const row = el("div", "fstage" + (isHire ? " hire" : isSource ? " source" : ""));
    const head = stageHead(entry.label, entry.label, sourceText(entry.sources),
      isSource ? "הוזן" : (denom ? pct(entry.total / denom) : null),
      isSource ? "chip" : "fpct");

    const track = el("div", "ftrack");
    const bar = el("div", "fbar");
    track.append(bar);
    later(() => { bar.style.width = ((entry.total / max) * 100).toFixed(1) + "%"; },
          70 + i * 60);

    const val = el("div", "fval");
    countUp(val, entry.total, 850);

    row.append(head, track, val);
    body.append(row);
  });
}

/* --- גרף 2: מתי צפויים להגיע לכל שלב --- *
 * גרף אחד לכל הקבוצות יחד, ולא גרף לכל שלב שהוזן. לכל שלב שורה אחת:
 * הכמות היא סכום ההגעות מכל הקבוצות, והזמן הוא ממוצע משוקלל של חציוני
 * הימים.                                                              */
function whenSourceText(row) {
  const parts = row.sources.map(x =>
    nf(x.count) + " מתוך " + nf(x.from_count) + " ב«" + x.from_label +
    "», חציון " + Math.round(x.days_median) + " ימים");
  return parts.join("  +  ") + (row.weighted
    ? "  ·  הזמן המוצג הוא ממוצע משוקלל לפי מספר המועמדים שכל קבוצה תורמת"
    : "");
}
