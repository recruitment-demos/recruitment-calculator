  const limits = [
    "מגבלות שחשוב להכיר:",
    "הגזירה היא קדימה בלבד. ממספר שהוזן בשלב מסוים אי אפשר לדעת כמה " +
      "מועמדים היו בשלבים שלפניו, ולכן הם אינם מוצגים.",
    "«זימון למבחן מקוון» אינו מופיע בתזרים. כמות שמוזנת בו נקשרת " +
      "לשרשרת לפי שיעור ההגעה שנמדד בקבצים אל «יום מיון מקוון», ומשם " +
      "והלאה לפי התזרים. כשזה קורה נאמר זאת בהערות.",
    "מרכז הערכה הוא תחנת צד ולא תחנת חובה: הוא נתלה על «יום מיון» " +
      "ואינו משתתף בחישוב.",
    "הזמן שנותר עד הגיוס אינו יורד בהכרח ככל שמתקדמים בתהליך, כי הוא " +
      "נמדד בכל שלב על קבוצה אחרת - רק על מי שהתגייס בפועל.",
    "הזמנים נמדדים רק על מועמדים שהגיעו בפועל לשלב היעד. מי שנעצר בדרך " +
      "אינו נספר.",
    "נתוני הזמנים מכסים " + m.activity_first + " עד " + m.hire_last +
      " בלבד. מועמדים שהחלו את התהליך לפני תחילת התקופה נראים בקובץ " +
      "כאילו התחילו בתוכה.",
    "כשמוזן יותר משלב אחד, המערכת מניחה שמדובר בקבוצות נפרדות ומסכמת " +
      "אותן. היא אינה יכולה לדעת אם אותם מועמדים מופיעים בכמה שלבים.",
    "כל המספרים במחשבון הם מצרפיים. אין בו מזהי מועמדים."
  ];

  const full = text.concat(limits);
  INFO.aboutBtn = { title: "איך המחשבון עובד", text: full };
  $("aboutBtn").setAttribute("data-info", full.join(" "));
  attachInfo("aboutBtn");

  const byStage = {};
  Object.keys(IMPORT.map).forEach(st => {
    const key = IMPORT.map[st];
    if (!byStage[key]) byStage[key] = [];
    byStage[key].push(st);
  });
  const mapLines = DATA.stages
    .filter(s => byStage[s.key])
    .map(s => byStage[s.key].map(x => "«" + x + "»").join(" ו") +
              " נספרים כ«" + s.label + "»");
  const blankStages = DATA.stages
    .filter(s => !byStage[s.key])
    .map(s => "«" + s.label + "»");

  setInfo("importInfo", "טעינה מקובץ מועמדים פעילים",
    ["דרך העבודה הרגילה של המחשבון היא הזנה ידנית, והיא לא השתנתה. " +
     "הכפתור הזה רק ממלא את אותם שדות מתוך קובץ «מועמדים פעילים», " +
     "ומשם והלאה רץ בדיוק אותו חישוב.",
     "הקובץ נקרא בדפדפן שלך בלבד. הוא אינו נשלח לשום מקום, אינו נשמר, " +
     "ואינו הופך לחלק מנתוני המחשבון.",
     "הקובץ יכול להיות בכל מבנה. המחשבון מחפש בו שני שדות בלבד: " +
     "«" + IMPORT.columns.status[0] + "» - השלב שבו נמצא המועמד - " +
     "ו«" + IMPORT.columns.candidate[0] + "», שמשמש לניכוי כפילויות. " +
     "שדה השלב לבדו מספיק; בלי שדה המועמד כל שורה נספרת כמועמד, " +
     "ונאמר על כך. שאר העמודות שבקובץ אינן נקראות כלל.",
     "שורת הכותרות אינה חייבת להיות הראשונה, שמות העמודות יכולים " +
     "להיות שונים במקצת, והקובץ יכול להיות כתוב לרוחב או לאורך - " +
     "הוא נבדק בשני הכיוונים. גם טבלת ריכוז מתקבלת: אם שמות השלבים " +
     "הם הכותרות והתאים הם כמויות, הכמויות נלקחות כמו שהן.",
     "אם יש בקובץ עמודת יחידה - «" + IMPORT.columns.unit[0] + "» או " +
     "דומה לה - נוספת בסוף העמוד טבלה של הגיוס הצפוי מכל יחידה. " +
     "כל שאר החישוב זהה, עם עמודת יחידה או בלעדיה.",
     "המיפוי: " + mapLines.join("; ") + ".",
     "סטטוסים שאינם עמדה במיון אינם נספרים כלל: " +
     IMPORT.ignore.map(x => "«" + x + "»").join(", ") + ".",
     blankStages.join(" ו") + " נשארים ריקים - אין להם סטטוס מקביל " +
     "בקובץ, ומילוי שלהם היה המצאת נתון.",
     "סטטוס שאינו מופיע ברשימות האלה אינו נספר, ונאמר עליו במפורש " +
     "מתחת לכפתור."]);

  setInfo("inputInfo", "מה להזין",
    ["ממלאים «יעד גיוס» בלבד - ומקבלים כמה צריך בכל שלב כדי להגיע אליו.",
     "ממלאים שלב - ומקבלים כמה יתגייסו ממנו. אפשר להזין כמה שלבים.",
     "ממלאים את שניהם - ומקבלים כמה עוד צריך מעבר למה שכבר בדרך.",
     "«תאריך היעד» משנה כמויות ולא רק תאריכים: הוא קובע את אורך החלון, " +
     "ולפיו נחתכת גם התקרה של הנתיב הקבוע. בלי תאריך החלון הוא שנה שלמה.",
     "כמות שמוזנת בשלב מוכפלת בשיעור ההמרה המשוקלל שלו - זה שמגלם " +
     "בתוכו גם את האוכלוסייה המוכרת.",
     "הבורר שמעל השדות קובע על איזה משפך רץ החישוב. «כלל הגיוסים» " +
     "כולל את שני הנתיבים; «גיוסים חדשים בלבד» מחשב על האוכלוסייה " +
     "החדשה בלבד, ביחס 1:31, בלי הנתיב המוכר - ולכן הוא דורש יותר " +
     "הגשות לאותו יעד. ברירת המחדל בכל רענון היא «כלל הגיוסים»."]);
}

buildInputs();
buildAbout();
setPopulation(false);   // «כלל הגיוסים» בכל רענון, בלי זיכרון
renderChart();
watchHero();
["heroInfo", "constraintInfo", "flowInfo", "gapPlanInfo", "whenInfo",
 "matrixInfo", "timelineInfo", "inputInfo", "chartInfo",
 "importInfo", "unitInfo"].forEach(attachInfo);
$("infoClose").addEventListener("click", closeInfo);
$("infoModal").addEventListener("click", ev => {
  if (ev && ev.target === $("infoModal")) closeInfo();
});
$("popAll").addEventListener("click", () => setPopulation(false));
$("popNew").addEventListener("click", () => setPopulation(true));
$("calcBtn").addEventListener("click", calculate);
$("resetBtn").addEventListener("click", reset);
$("importBtn").addEventListener("click", () => $("importFile").click());
$("importFile").addEventListener("change", ev => {
  const picked = ev && ev.target && ev.target.files ? ev.target.files[0] : null;
  loadActiveFile(picked);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeInfo();
  else if (e.key === "Enter") calculate();
});
</script>
