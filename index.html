const INFO = {};

function paras(text) {
  return (Array.isArray(text) ? text : [text]).filter(t => t);
}

function openInfo(title, text) {
  $("infoTitle").textContent = title;
  const body = $("infoText");
  body.innerHTML = "";
  paras(text).forEach(t => body.append(el("p", null, t)));
  $("infoModal").classList.add("open");
}

function closeInfo() {
  const modal = $("infoModal");
  modal.classList.remove("open");
  modal.classList.remove("alert");
}

function infoBtn(title, text) {
  const b = el("button", "info", "ⓘ");
  b.setAttribute("type", "button");
  b.setAttribute("title", "הסבר");
  b.setAttribute("data-info", paras(text).join(" "));
  b.addEventListener("click", () => openInfo(title, text));
  return b;
}

/* כפתור קבוע שיושב ב-HTML. הטקסט שלו מתחלף בכל חישוב, ולכן הוא נשמר
   במפה במקום להוסיף מאזין נוסף בכל פעם. */
function setInfo(id, title, text) {
  INFO[id] = { title: title, text: text };
  $(id).setAttribute("data-info", paras(text).join(" "));
}

function attachInfo(id) {
  $(id).addEventListener("click", () => {
    const rec = INFO[id];
    if (rec) openInfo(rec.title, rec.text);
  });
}

/* ---------- שדות הקלט ---------- */
function makeField(key, labelText, extraClass, hintText, type) {
  const wrap = el("div", "field" + (extraClass ? " " + extraClass : ""));
  const lab = el("label", null, labelText);
  lab.setAttribute("for", "in_" + key);
  const inp = el("input");
  inp.id = "in_" + key;
  inp.type = type || "number";
  if (!type) { inp.min = "0"; inp.placeholder = "—"; }
  wrap.append(lab, inp);
  if (hintText) wrap.append(el("span", "hint", hintText));
  return wrap;
}

function buildInputs() {
  const grid = $("inputGrid");
  DATA.stages.forEach(s => {
    grid.append(makeField(s.key, s.label,
      s.has_data ? "" : "no-data", s.has_data ? "" : "אין נתונים"));
  });
  grid.append(makeField("target", "יעד גיוס", "target", ""));
  grid.append(makeField("targetDate", "תאריך היעד", "when", "", "date"));
}

function readInputs() {
  const counts = {};
  DATA.stages.forEach(s => {
    const raw = $("in_" + s.key).value.trim();
    const n = raw === "" ? null : Number(raw);
    counts[s.key] = Number.isFinite(n) ? n : null;
  });
  const rawT = $("in_target").value.trim();
  const t = rawT === "" ? null : Number(rawT);
  const rawDate = String($("in_targetDate").value || "").trim();
  return {
    counts: counts,
    target: Number.isFinite(t) ? t : null,
    targetDate: parseDay(rawDate),
    badDate: rawDate !== "" && parseDay(rawDate) === null ? rawDate : null
  };
}

/* ------------------------------------------------------------------ *
 *  טעינת קובץ «מועמדים פעילים»                                        *
 *                                                                     *
 *  זו דרך צדדית למלא את אותם שדות קלט, ולא דרך עבודה אחרת. אין כאן    *
 *  שום חישוב: הקובץ נספר, המספרים נכתבים לשדות מול עיני המשתמש,       *
 *  ומשם והלאה רץ בדיוק אותו מחשבון.                                    *
 *                                                                     *
 *  הקריאה מתבצעת כולה בדפדפן. הקובץ אינו נשלח לשום מקום ואינו נשמר.   *
 *  המיפוי בין הסטטוסים שבקובץ לשלבי המחשבון בא מ-DATA.active_import    *
 *  (config/params.json) ואינו כתוב כאן.                                *
 * ------------------------------------------------------------------ */
const IMPORT = DATA.active_import;

function txt(v) {
  return v === null || v === undefined ? "" : String(v).trim();
}

/* השוואת שמות בלי רווחים ובלי מירכאות: «יחב"מ» ו«יחב״מ» אותו דבר,
   ו«מועמד(קוד)» זהה ל«מועמד (קוד)». */
function normKey(v) {
  // כולל סימני כיווניות ורווח קשיח, שנדבקים לכותרות שיוצאות ממערכות.
  return txt(v).replace(/[\s"'״׳“”\u200e\u200f\u202a-\u202e\u00a0]/g, "");
}

/* מיפוי מנורמל של הסטטוסים, כדי שהתאמה לא תיפול על רווח או מירכאה. */
const MAP_N = {};
Object.keys(IMPORT.map).forEach(s => { MAP_N[normKey(s)] = IMPORT.map[s]; });
const IGNORE_N = {};
IMPORT.ignore.forEach(s => { IGNORE_N[normKey(s)] = true; });

function stageOf(v) { return MAP_N[normKey(v)] || null; }
function isIgnored(v) { return !!IGNORE_N[normKey(v)]; }

/* ציון התאמה של כותרת לשם עמודה מוכר: זהות מלאה, או שהכותרת
   שבקובץ מתחילה בשם המוכר («מועמד(קוד)» מתחיל ב«מועמד»). לא מספיק
   שהשם מופיע באמצע - «מקור מועמדות» אינו עמודת מועמד. */
function headMatch(cell, names) {
  const c = normKey(cell);
  const none = { level: 0, rank: 999 };
  if (!c) return none;
  let best = none;
  for (let i = 0; i < names.length; i++) {
    const k = normKey(names[i]);
    if (!k) continue;
    let level = 0;
    if (c === k) level = 3;
    else if (c.indexOf(k) === 0) level = 2;
    if (!level) continue;
    if (level > best.level || (level === best.level && i < best.rank))
      best = { level: level, rank: i };
  }
  return best;
}

function headScore(cell, names) { return headMatch(cell, names).level; }

/* סדר הרשימה שבקונפיג הוא סדר עדיפויות, ולא סדר העמודות שבקובץ:
   «י.ארגונית מחוזית» נבחרת לפני «יחידה ארגונית» גם כששתיהן קיימות
   וגם כשהשנייה מופיעה קודם. זו היתה תקלה שדווחה. */
function bestColumn(head, names) {
  let index = -1, level = 0, rank = 999;
  for (let i = 0; i < head.length; i++) {
    const m = headMatch(head[i], names);
    if (!m.level) continue;
    if (m.level > level || (m.level === level && m.rank < rank)) {
      level = m.level; rank = m.rank; index = i;
    }
  }
  return { index: index, score: level, rank: rank };
}

/* מספר יכול להגיע כטקסט, עם פסיקים, עם רווחים, עם סימני כיווניות
   ואפילו עם אחוז. כל אלה מנוקים לפני הבדיקה. */
function cleanNum(v) {
  return txt(v).replace(/[\s,\u200e\u200f\u00a0%]/g, "");
}

function isNumeric(v) {
  if (typeof v === "number") return isFinite(v);
  const s = cleanNum(v);
  return s !== "" && /^-?\d+(\.\d+)?$/.test(s);
}

function toNumber(v) {
  if (typeof v === "number") return v;
  const s = cleanNum(v);
  return /^-?\d+(\.\d+)?$/.test(s) ? Number(s) : 0;
}

function isTotalLabel(v) {
  return headScore(v, IMPORT.columns.total) > 0;
}

/* היפוך הטבלה. אותה טבלה בדיוק, רק שהשורות הן העמודות - כך אותו
   קוד זיהוי מטפל גם בקובץ שנכתב לרוחב וגם בקובץ שנכתב לאורך. */
function transpose(table) {
  let width = 0;
  table.forEach(r => { if (r && r.length > width) width = r.length; });
  const out = [];
  for (let c = 0; c < width; c++) {
    const row = [];
    for (let r = 0; r < table.length; r++) {
      row.push(table[r] ? table[r][c] : null);
    }
    out.push(row);
  }
  return out;
}

/* תא ממוזג נושא ערך בפינה אחת בלבד, ושאר התאים בטווח חוזרים ריקים.
   כאן הערך מועתק לכל התאים שבטווח, לפי רשימת המיזוגים של הגיליון -
   ולא לפי ניחוש. בלי זה טבלה עם כותרת ממוזגת נראית כמו טבלה ריקה. */
function expandMerges(sheet) {
  const merges = sheet && sheet["!merges"];
  if (!merges || !merges.length || typeof XLSX === "undefined") return;
  merges.forEach(m => {
    if (!m || !m.s || !m.e) return;
    const from = XLSX.utils.encode_cell({ r: m.s.r, c: m.s.c });
    const anchor = sheet[from];
    if (!anchor) return;
    for (let r = m.s.r; r <= m.e.r; r++) {
      for (let c = m.s.c; c <= m.e.c; c++) {
        const at = XLSX.utils.encode_cell({ r: r, c: c });
        if (!sheet[at]) sheet[at] = { t: anchor.t, v: anchor.v, w: anchor.w };
      }
    }
  });
}

const UNKNOWN_UNIT = "לא צוין";

function emptyCounts() {
  const c = {};
  DATA.stages.forEach(s => { c[s.key] = null; });
  return c;
}

function addTo(bag, key, n) {
  if (bag[key] === null || bag[key] === undefined) bag[key] = 0;
  bag[key] += n;
}

/* ------------------------------------------------------------------ *
 *  קריאת טבלה בפריסה של «שורה למועמד»                                 *
 *  שורת כותרות כלשהי (לא בהכרח הראשונה), עמודת סטטוס, ואם יש -        *
 *  עמודת מועמד לניכוי כפילויות ועמודת יחידה לפילוח.                    *
 * ------------------------------------------------------------------ */
function readRecords(table, r, cols) {
  const res = {
    mode: "records", headerRow: r, columns: cols, dedup: cols.candidate >= 0,
    rows: 0, unique: 0, ignored: 0, noId: 0, twice: 0,
    unknown: {}, unknownRows: 0, counts: emptyCounts(), units: {}
  };
  const perStage = {}, perCand = {}, perUnit = {};
  for (let i = r + 1; i < table.length; i++) {
    const row = table[i] || [];
    const status = txt(row[cols.status]);
    const id = cols.candidate >= 0 ? txt(row[cols.candidate]) : "";
    const unit = cols.unit >= 0 ? (txt(row[cols.unit]) || UNKNOWN_UNIT) : null;
    if (!status && !id) continue;
    res.rows++;
    if (!status || isIgnored(status)) { res.ignored++; continue; }
    const key = stageOf(status);
    if (!key) {
      res.unknown[status] = (res.unknown[status] || 0) + 1;
      res.unknownRows++;
      continue;
    }
    // בלי עמודת מועמד כל שורה היא מועמד. אין דרך לדעת אחרת, וזה נאמר.
    const mark = res.dedup ? id : "#" + i;
    if (res.dedup && !id) { res.noId++; continue; }
    if (!perStage[key]) perStage[key] = {};
    perStage[key][mark] = true;
    if (!perCand[mark]) perCand[mark] = {};
    perCand[mark][key] = true;
    if (unit !== null) {
      if (!perUnit[unit]) perUnit[unit] = {};
      if (!perUnit[unit][key]) perUnit[unit][key] = {};
      perUnit[unit][key][mark] = true;
    }
  }
  DATA.stages.forEach(s => {
    if (perStage[s.key]) res.counts[s.key] = Object.keys(perStage[s.key]).length;
  });
  Object.keys(perCand).forEach(id => {
    res.unique++;
    if (Object.keys(perCand[id]).length > 1) res.twice++;
  });
  Object.keys(perUnit).forEach(u => {
    const c = emptyCounts();
    Object.keys(perUnit[u]).forEach(k => {
      c[k] = Object.keys(perUnit[u][k]).length;
    });
    res.units[u] = c;
  });
  return res;
}

/* ------------------------------------------------------------------ *
 *  קריאת טבלת ריכוז (PIVOT)                                           *
 *  שמות השלבים הם הכותרות, והתאים שמתחתיהם הם כמויות. שורה אחת -      *
 *  סיכום כללי; כמה שורות - שורה ליחידה, אם יש עמודת תווית מוכרת.      *
 *  הפריסה ההפוכה (שלבים בעמודה) מטופלת על ידי היפוך הטבלה.            *
 * ------------------------------------------------------------------ */
function readPivot(table, r, statusCols, labelCol) {
  const res = {
    mode: "pivot", headerRow: r, columns: { candidate: -1, status: -1, unit: labelCol },
    dedup: false, rows: 0, unique: 0, ignored: 0, noId: 0, twice: 0,
    unknown: {}, unknownRows: 0, counts: emptyCounts(), units: {}
  };
  const data = [];
  for (let i = r + 1; i < table.length; i++) {
    const row = table[i] || [];
    let any = false;
    statusCols.forEach(sc => { if (isNumeric(row[sc.index])) any = true; });
    if (any) data.push({ row: row, label: labelCol >= 0 ? txt(row[labelCol]) : "" });
  }
  // שורת «סה"כ» בתוך ריכוז שיש בו כמה שורות היא כפילות, ולא נתון נוסף.
  const rows = data.length > 1 ? data.filter(d => !isTotalLabel(d.label)) : data;
  rows.forEach(d => {
    const c = emptyCounts();
    let any = 0;
    statusCols.forEach(sc => {
      if (!isNumeric(d.row[sc.index])) return;
      const n = Math.round(toNumber(d.row[sc.index]));
      if (!n) return;
      addTo(res.counts, sc.key, n);
      addTo(c, sc.key, n);
      any += n;
    });
    res.rows += any;
    res.unique += any;
    if (labelCol >= 0 && any) {
      const name = d.label || UNKNOWN_UNIT;
      if (!res.units[name]) res.units[name] = emptyCounts();
      DATA.stages.forEach(s => {
        if (c[s.key] !== null) addTo(res.units[name], s.key, c[s.key]);
      });
    }
  });
  // סטטוסים שבכותרות ואינם מוכרים - כדי שייאמר עליהם, בדיוק כמו
  // בטבלה רגילה.
  (table[r] || []).forEach((cell, i) => {
    const name = txt(cell);
    if (!name || i === labelCol) return;
    if (stageOf(name) || isIgnored(name)) return;
    if (headScore(name, IMPORT.columns.total) > 0) return;
    let numeric = false;
    for (let k = r + 1; k < table.length; k++) {
      if (table[k] && isNumeric(table[k][i])) { numeric = true; break; }
    }
    if (numeric) {
      res.unknown[name] = (res.unknown[name] || 0) + 1;
      res.unknownRows++;
    }
  });
  return res;
}

/* ------------------------------------------------------------------ *
 *  זיהוי הפריסה                                                       *
 *  עוברים על השורות הראשונות ומחפשים שורת כותרות. שלוש אפשרויות,      *
 *  לפי איכות: עמודת מועמד וסטטוס (100), טבלת ריכוז (60), עמודת        *
 *  סטטוס בלבד (40). הטבלה נבדקת גם כמו שהיא וגם הפוכה, והזוכה הוא     *
 *  הזיהוי הטוב יותר - כך אותו קוד קורא קובץ לרוחב וקובץ לאורך.        *
 * ------------------------------------------------------------------ */
function scanLayout(table) {
  const limit = Math.min(table.length, 20);
  let best = null;
  for (let r = 0; r < limit; r++) {
    const head = table[r] || [];
    if (!head.length) continue;

    const statusCols = [];
    head.forEach((cell, i) => {
      const key = stageOf(cell);
      if (key) statusCols.push({ index: i, key: key });
    });

    const cand = bestColumn(head, IMPORT.columns.candidate);
    const stat = bestColumn(head, IMPORT.columns.status);
    const unit = bestColumn(head, IMPORT.columns.unit);

    // שורה למועמד: עמודת סטטוס לפי שם, ומתחתיה סטטוסים אמיתיים.
    if (stat.score > 0 && statusCols.length < 2) {
      let hits = 0;
      for (let i = r + 1; i < table.length && i < r + 400; i++) {
        const v = (table[i] || [])[stat.index];
        if (stageOf(v) || isIgnored(v)) hits++;
      }
      if (hits) {
        const score = cand.score > 0 ? 100 : 40;
        if (!best || score > best.score) {
          best = { score: score, kind: "records", row: r, cols: {
            candidate: cand.score > 0 ? cand.index : -1,
            status: stat.index,
            unit: unit.score > 0 ? unit.index : -1
          } };
        }
      }
    }

    // טבלת ריכוז: שני שמות שלב או יותר ככותרות, ומתחתיהם מספרים.
    if (statusCols.length >= 2) {
      let numeric = false;
      for (let i = r + 1; i < table.length && !numeric; i++) {
        statusCols.forEach(sc => {
          if (isNumeric((table[i] || [])[sc.index])) numeric = true;
        });
      }
      if (numeric && (!best || best.score < 60)) {
        let labelCol = unit.score > 0 ? unit.index : -1;
        if (labelCol >= 0 && stageOf(head[labelCol])) labelCol = -1;
        best = { score: 60, kind: "pivot", row: r,
                 statusCols: statusCols, labelCol: labelCol };
      }
    }
  }
  return best;
}

/* הקריאה המלאה: זיהוי, ואם ההפוך טוב יותר - קוראים אותו. */
function activeCounts(table) {
  const blank = {
    ok: false, mode: null, flipped: false, dedup: false,
    rows: 0, unique: 0, ignored: 0, noId: 0, twice: 0,
    unknown: {}, unknownRows: 0, counts: emptyCounts(), units: {}
  };
  if (!table || !table.length) return blank;

  const direct = scanLayout(table);
  let flat = null, use = direct, source = table, flipped = false;
  if (!direct || direct.score < 100) {
    flat = transpose(table);
    const other = scanLayout(flat);
    if (other && (!direct || other.score > direct.score)) {
      use = other; source = flat; flipped = true;
    }
  }
  if (!use) return blank;

  const res = use.kind === "records"
    ? readRecords(source, use.row, use.cols)
    : readPivot(source, use.row, use.statusCols, use.labelCol);
  res.ok = true;
  res.flipped = flipped;
  let total = 0;
  DATA.stages.forEach(s => { if (res.counts[s.key]) total += res.counts[s.key]; });
  res.counted = total;
  return res;
}

/* השורות שמתחת לכפתור. הודעה אחת ראשית, ומתחתיה מה שצריך לדעת. */
function importMsg(lines) {
  IMPORT_LINES = lines || [];
  const box = $("importMsg");
  box.innerHTML = "";
  lines.forEach(l => {
    if (!l || !l.text) return;
    box.append(el("div", l.cls || "detail", l.text));
  });
}

/* שמות השלבים שנשארים ריקים - אין להם סטטוס מקביל בקובץ. */
function importBlankStages(res) {
  return DATA.stages.filter(s => res.counts[s.key] === null)
                    .map(s => s.label);
}

/* הפילוח לפי יחידה, אם הקובץ נשא עמודת יחידה. נשמר כאן כדי שהטבלה
   תיבנה מחדש בכל חישוב - עם התאריך שהוזן ועם בורר האוכלוסייה. */
let ACTIVE_UNITS = null;

/* שורות הסיכום האחרונות, כדי שאפשר יהיה להחזיר אותן אחרי כישלון. */
let IMPORT_LINES = [];

/* ממלא את השדות מתוך הטבלה ומריץ את החישוב. מחזיר את הספירה. */
function applyActiveRows(table) {
  const res = activeCounts(table);
  if (!res.ok) {
    ACTIVE_UNITS = null;
    importMsg([{ cls: "bad", text:
      "לא זוהתה בקובץ עמודה של שלב המועמד. צריך שיהיה בו שדה אחד " +
      "לפחות עם שמות השלבים - למשל «" + IMPORT.columns.status[0] +
      "» - או טבלת ריכוז שבה שמות השלבים הם הכותרות." }]);
    return res;
  }
  if (!res.counted) {
    ACTIVE_UNITS = null;
    importMsg([{ cls: "bad", text:
      "לא נמצאה בקובץ אף שורה בסטטוס שהמחשבון מכיר." }]);
    return res;
  }

  DATA.stages.forEach(s => {
    $("in_" + s.key).value =
      res.counts[s.key] === null ? "" : String(res.counts[s.key]);
  });

  const unitNames = Object.keys(res.units);
  ACTIVE_UNITS = unitNames.length ? res.units : null;

  const parts = DATA.stages
    .filter(s => res.counts[s.key] !== null)
    .map(s => s.label + " " + nf(res.counts[s.key]));

  const what = res.dedup ? "מועמדים" : "רשומות";
  const lines = [
    { cls: "head", text:
      "נטענו " + nf(res.unique) + " " + what +
      (res.mode === "pivot" ? " מטבלת ריכוז." : " מתוך " + nf(res.rows) +
       " שורות בקובץ.") },
    { cls: "detail", text: parts.join("  ·  ") }
  ];
  if (res.flipped) {
    lines.push({ cls: "detail", text:
      "הקובץ נקרא לפי שורות: שמות השלבים נמצאו בעמודה ולא בשורת כותרות." });
  }
  if (!res.dedup && res.mode === "records") {
    lines.push({ cls: "warn", text:
      "אין בקובץ עמודת מספר מועמד, ולכן כל שורה נספרה כמועמד. " +
      "כפילויות, אם יש, נספרות פעמיים." });
  }
  const blank = importBlankStages(res);
  if (blank.length) {
    lines.push({ cls: "detail", text:
      "נשארו ריקים: " + blank.join(", ") +
      " - אין להם סטטוס מקביל בקובץ." });
  }
  if (res.ignored) {
    lines.push({ cls: "detail", text:
      nf(res.ignored) + " שורות בסטטוסים שאינם עמדה במיון לא נספרו." });
  }
  if (res.twice) {
    lines.push({ cls: "warn", text:
      nf(res.twice) + " מועמדים מופיעים בשני שלבים ונספרו בשניהם." });
  }
  if (res.noId) {
    lines.push({ cls: "warn", text:
      nf(res.noId) + " שורות בלי מספר מועמד לא נספרו." });
  }
  const unknown = Object.keys(res.unknown);
  if (unknown.length) {
    lines.push({ cls: "warn", text:
      "סטטוסים שאינם מוכרים למחשבון ולא נספרו: " +
      unknown.map(s => "«" + s + "»").join(", ") + "." });
  }
  if (unitNames.length) {
    lines.push({ cls: "detail", text:
      "נמצאה עמודת יחידה עם " + nf(unitNames.length) +
      " יחידות. הפילוח מופיע בטבלה שבסוף העמוד." });
  }
  importMsg(lines);
  calculate();
  return res;
}

/* ------------------------------------------------------------------ *
 *  שחזור מצב וטיפול בשגיאות                                           *
 *                                                                     *
 *  טעינה שנכשלה אינה משאירה את העמוד באמצע. לפני כל ניסיון נשמר       *
 *  צילום של כל השדות, של הפילוח ושל שורות הסיכום, וכל כישלון מחזיר    *
 *  אותו בדיוק כפי שהיה - ומסביר במפורש מה קרה.                        *
 * ------------------------------------------------------------------ */
function snapshotInputs() {
  const values = {};
  DATA.stages.forEach(s => { values[s.key] = $("in_" + s.key).value; });
  return {
    values: values,
    target: $("in_target").value,
    date: $("in_targetDate").value,
    units: ACTIVE_UNITS,
    lines: IMPORT_LINES,
    shown: !$("results").classList.contains("hidden")
  };
}

function restoreInputs(snap) {
  if (!snap) return;
  DATA.stages.forEach(s => { $("in_" + s.key).value = snap.values[s.key]; });
  $("in_target").value = snap.target;
  $("in_targetDate").value = snap.date;
  ACTIVE_UNITS = snap.units;
  importMsg(snap.lines);
  if (snap.shown) calculate();
}

/* הודעת שגיאה מעוצבת. אותו חלון של ההסברים, בגוון אזהרה. */
function openAlert(title, text) {
  const modal = $("infoModal");
  if (modal.classList) modal.classList.add("alert");
  openInfo(title, text);
}

function failImport(snap, short, title, lines) {
  restoreInputs(snap);
  importMsg((snap && snap.lines && snap.lines.length ? snap.lines : [])
    .concat([{ cls: "bad", text: short }]));
  openAlert(title, lines);
}

/* קריאת הקובץ עצמה. הכל אצל המשתמש: הקובץ נקרא לזיכרון הדפדפן,
   נספר, ונזרק. אין שליחה ואין שמירה. */
function loadActiveFile(file) {
  if (!file) return;
  const snap = snapshotInputs();
  if (typeof XLSX === "undefined") {
    failImport(snap, "ספריית קריאת האקסל לא נטענה.",
      "אי אפשר לקרוא את הקובץ",
      ["ספריית קריאת האקסל לא נטענה בעמוד הזה, ולכן אין דרך לפתוח את " +
       "הקובץ. רענון העמוד בדרך כלל פותר את זה.",
       "בינתיים אפשר להזין את המספרים ידנית - זו דרך העבודה הרגילה של " +
       "המחשבון, והיא לא השתנתה."]);
    return;
  }
  importMsg([{ cls: "detail", text: "קורא את הקובץ..." }]);
  const reader = new FileReader();
  reader.onerror = () => {
    failImport(snap, "לא הצלחתי לקרוא את הקובץ.",
      "הקובץ לא נקרא",
      ["הדפדפן לא הצליח לפתוח את הקובץ שנבחר. זה קורה כשהקובץ נמחק או " +
       "הועבר אחרי הבחירה, או כשאין הרשאה לקרוא אותו.",
       "השדות הוחזרו בדיוק למצב שהיו בו לפני הניסיון."]);
  };
  reader.onload = ev => {
    try {
      const book = XLSX.read(new Uint8Array(ev.target.result), { type: "array" });
      const names = (book && book.SheetNames) || [];
      if (!names.length) {
        failImport(snap, "אין בקובץ אף גיליון.",
          "הקובץ ריק",
          ["הקובץ נפתח, אבל אין בו אף גיליון עם נתונים.",
           "השדות הוחזרו בדיוק למצב שהיו בו לפני הניסיון."]);
        return;
      }
      // כל הגיליונות נבדקים, והטוב שבהם נבחר. בקובץ ריכוז הגיליון
      // הראשון הוא לא פעם דף שער.
      let best = null, anyRows = false;
      for (let i = 0; i < names.length; i++) {
        const sheet = book.Sheets[names[i]];
        if (!sheet) continue;
        expandMerges(sheet);
        const table = XLSX.utils.sheet_to_json(
          sheet, { header: 1, defval: null, raw: true, blankrows: false });
        if (table.length) anyRows = true;
        const res = activeCounts(table);
        if (res.ok && res.counted && (!best || res.counted > best.counted)) {
          best = res; best.table = table;
        }
      }
      if (!best) {
        const what = anyRows
          ? "לא נמצאה בקובץ עמודה של שלב המועמד."
          : "אין בקובץ שורות.";
        failImport(snap, what, "הקובץ אינו מתאים",
          [anyRows
            ? "הקובץ נקרא, אבל לא נמצא בו שדה שמכיל את שלב המועמד - " +
              "כלומר עמודה כמו «" + IMPORT.columns.status[0] + "» עם ערכים " +
              "כמו אלה שהמחשבון מכיר, או טבלת ריכוז שבה שמות השלבים הם " +
              "הכותרות."
            : "הקובץ נפתח אבל אין בו שורות עם תוכן.",
           "אפשר לתקן את הקובץ ולנסות שוב: מספיק שדה אחד עם שם השלב. " +
           "שדה מספר המועמד אינו חובה - הוא רק מונע ספירה כפולה.",
           "השדות שבמחשבון הוחזרו בדיוק למצב שהיו בו לפני הניסיון."]);
        return;
      }
      const done = applyActiveRows(best.table);
      if (!done || !done.ok || !done.counted) restoreInputs(snap);
    } catch (err) {
      failImport(snap, "פורמט הקובץ אינו נתמך.",
        "פורמט הקובץ אינו נתמך",
        ["לא הצלחתי לפתוח את הקובץ. זה קורה כשהקובץ פגום, כשהוא מוגן " +
         "בסיסמה, או כשהוא אינו קובץ גיליון אלא משהו אחר ששינו לו את " +
         "הסיומת.",
         "נתמכים קובצי אקסל (xlsx, xlsm, xlsb, xls) וקובצי טקסט מופרדים " +
         "בפסיקים. אם הקובץ נפתח באקסל - שמירה מחדש בשם פותרת את זה " +
         "כמעט תמיד.",
         "השדות הוחזרו בדיוק למצב שהיו בו לפני הניסיון."]);
    }
  };
  try {
    reader.readAsArrayBuffer(file);
  } catch (err) {
    failImport(snap, "לא הצלחתי לקרוא את הקובץ.", "הקובץ לא נקרא",
      ["הדפדפן לא הצליח לפתוח את הקובץ שנבחר.",
       "השדות הוחזרו בדיוק למצב שהיו בו לפני הניסיון."]);
  }
}

/* ------------------------------------------------------------------ *
 *  גיוס לפי יחידה                                                     *
 *                                                                     *
 *  מוצג רק כשהקובץ שנטען נשא עמודת יחידה. לכל יחידה רצה בדיוק אותה    *
 *  זרימה קדימה שרצה על הסך הכול, עם אותו בורר אוכלוסייה ואותו חלון    *
 *  זמן, ולכן הטבלה משתנה יחד עם שאר העמוד.                             *
 *                                                                     *
 *  סכום השורות יכול להיבדל בכמה מהמספר הראשי: כל שורה מעוגלת בפני     *
 *  עצמה. זה נאמר במפורש ב-ⓘ.                                          *
 * ------------------------------------------------------------------ */
/* ------------------------------------------------------------------ *
 *  צבעי הפילוח                                                        *
 *                                                                     *
 *  סדר קבוע, ולא מחזורי: כל יחידה מקבלת את הצבע לפי מקומה בדירוג,     *
 *  ו«אחר» תמיד אפור - הוא אינו יחידה אלא איחוד של כמה. הסדר נבחר      *
 *  כך שכל שני צבעים סמוכים נבדלים גם בעיוורון צבעים, ונבדק בכלי       *
 *  בדיקה ולא בעין. הזהות לעולם אינה בצבע בלבד: לכל פרוסה יש שורה      *
 *  בטבלה עם השם, הכמות והאחוז.                                        *
 * ------------------------------------------------------------------ */
const SLICE_COLORS = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100",
                      "#e87ba4", "#008300", "#4a3aa7", "#e34948"];
const OTHER_COLOR = "#8a99ad";
const OTHER_LABEL = "אחר";
const SLICE_MIN = 0.05;   // יחידה שחלקה קטן מ-5% מתאחדת ל«אחר»

function escapeText(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
                  .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

/* קשת אחת בטבעת. הזוויות מתחילות למעלה ומתקדמות עם כיוון השעון. */
function donutArc(cx, cy, rOut, rIn, from, to) {
  const at = (r, a) => [(cx + r * Math.cos(a)).toFixed(2),
                        (cy + r * Math.sin(a)).toFixed(2)];
  const big = (to - from) > Math.PI ? 1 : 0;
  const o1 = at(rOut, from), o2 = at(rOut, to);
  const i2 = at(rIn, to), i1 = at(rIn, from);
  return "M" + o1[0] + "," + o1[1] +
         "A" + rOut + "," + rOut + " 0 " + big + " 1 " + o2[0] + "," + o2[1] +
         "L" + i2[0] + "," + i2[1] +
         "A" + rIn + "," + rIn + " 0 " + big + " 0 " + i1[0] + "," + i1[1] + "Z";
}

/* טבעת שלמה מתוך רשימת חלקים. מוחזרת כמחרוזת SVG, כדי שלא תידרש
   יצירת אלמנטים במרחב שמות - וכך אותו קוד רץ גם בבדיקות. */
function donutSvg(parts, centerBig, centerSmall) {
  const size = 200, cx = 100, cy = 100, rOut = 92, rIn = 62;
  const total = parts.reduce((a, p) => a + p.value, 0);
  let out = '<svg viewBox="0 0 ' + size + ' ' + size + '" class="donutsvg" ' +
            'role="img" aria-label="' +
            escapeText("פילוח הגיוסים הצפויים לפי יחידה") + '">';
  if (total <= 0) return out + "</svg>";

  if (parts.length === 1) {
    out += '<circle cx="' + cx + '" cy="' + cy + '" r="' + ((rOut + rIn) / 2) +
           '" fill="none" stroke="' + parts[0].color + '" stroke-width="' +
           (rOut - rIn) + '"><title>' + escapeText(parts[0].label) +
           "</title></circle>";
  } else {
    // רווח קטן בין הפרוסות, כדי ששתי פרוסות סמוכות לא יתלכדו לכתם אחד
    const gap = 0.018;
    let a = -Math.PI / 2;
    parts.forEach(p => {
      const sweep = (p.value / total) * Math.PI * 2;
      const from = a + gap / 2, to = a + sweep - gap / 2;
      if (to > from) {
        out += '<path d="' + donutArc(cx, cy, rOut, rIn, from, to) + '" fill="' +
               p.color + '" class="slice"><title>' +
               escapeText(p.label + " · " + nf(p.value) + " · " +
                          pct(p.value / total)) + "</title></path>";
      }
      a += sweep;
    });
  }
  out += '<text x="' + cx + '" y="' + (cy - 4) + '" class="dnum">' +
         escapeText(nf(centerBig)) + "</text>";
  out += '<text x="' + cx + '" y="' + (cy + 16) + '" class="dcap">' +
         escapeText(centerSmall) + "</text>";
  return out + "</svg>";
}

/* ------------------------------------------------------------------ *
 *  גיוס לפי יחידה                                                     *
 *                                                                     *
 *  מוצג רק כשהקובץ שנטען נשא עמודת יחידה. לכל יחידה רצה בדיוק אותה    *
 *  זרימה קדימה שרצה על הסך הכול, עם אותו בורר אוכלוסייה ואותו חלון    *
 *  זמן, ולכן הכרטיס משתנה יחד עם שאר העמוד.                            *
 *                                                                     *
 *  סכום השורות יכול להיבדל בכמה מהמספר הראשי: כל שורה מעוגלת בפני     *
 *  עצמה. ההפרש נאמר מתחת לטבלה ואינו מוסתר.                            *
 * ------------------------------------------------------------------ */
function renderUnits(counts, days, targetDate) {
  if (!ACTIVE_UNITS) return false;
  const names = Object.keys(ACTIVE_UNITS);
  if (!names.length) return false;

  const unitHires = one => {
    const flow = Engine.constrainedCombine(one, days, NEW_ONLY);
    // אותה הבחנה בדיוק שבכרטיס הראשי: עם תאריך מוצג רק מה שנכנס בחלון.
    const timed = flow && !flow.annual && flow.hires_in_time !== null &&
                  flow.hires_in_time !== undefined;
    return !flow ? 0 : (timed ? flow.hires_in_time : flow.hires);
  };

  const rows = names.map(name => {
    const mine = ACTIVE_UNITS[name];
    let active = 0;
    DATA.stages.forEach(s => { if (mine[s.key]) active += mine[s.key]; });
    return { name: name, active: active, hires: unitHires(mine) };
  }).filter(r => r.active > 0);

  if (!rows.length) return false;
  rows.sort((a, b) => b.hires - a.hires || b.active - a.active);

  let sumActive = 0, sumHires = 0;
  rows.forEach(r => { sumActive += r.active; sumHires += r.hires; });

  /* כלל ה-5%: יחידה שחלקה קטן מכך מתאחדת ל«אחר», וכך הטבעת נשארת
     קריאה. גם מעבר לשש יחידות צבועות הן מתאחדות - צבע שביעי לא היה
     נבדל מקודמיו. */
  const big = [], small = [];
  rows.forEach(r => {
    const share = sumHires ? r.hires / sumHires : 0;
    if (share >= SLICE_MIN && big.length < SLICE_COLORS.length) big.push(r);
    else small.push(r);
  });
  const colorOf = {};
  big.forEach((r, i) => { colorOf[r.name] = SLICE_COLORS[i]; });
  const otherHires = small.reduce((a, r) => a + r.hires, 0);
  const parts = big.map((r, i) => ({
    label: r.name, value: r.hires, color: SLICE_COLORS[i]
  }));
  if (otherHires > 0) {
    parts.push({
      label: OTHER_LABEL + " (" + nf(small.length) + " יחידות)",
      value: otherHires, color: OTHER_COLOR
    });
  }

  $("unitDonut").innerHTML = donutSvg(
    parts, sumHires, days === null ? "מגויסים צפויים" : "עד התאריך");

  const legend = $("unitLegend");
  legend.innerHTML = "";
  parts.forEach(p => {
    const item = el("div", "lgitem");
    const dot = el("span", "lgdot");
    dot.setAttribute("style", "background:" + p.color);
    item.append(dot, el("span", "lgname", p.label),
                el("span", "lgval", pct(sumHires ? p.value / sumHires : 0)));
    legend.append(item);
  });

  const table = $("unitBody");
  table.innerHTML = "";
  const head = el("tr");
  head.append(el("th", null, ""), el("th", null, "יחידה"),
              el("th", null, "מועמדים פעילים"),
              el("th", null, days === null ? "מגויסים צפויים"
                                           : "מגויסים עד התאריך"),
              el("th", null, "חלק מהגיוסים"));
  table.append(head);

  const topShare = rows.length ? (sumHires ? rows[0].hires / sumHires : 0) : 0;
  rows.forEach((r, i) => {
    const share = sumHires ? r.hires / sumHires : 0;
    const tr = el("tr", i < 3 ? "lead" : "");

    const chipCell = el("td", "dotcell");
    const dot = el("span", "lgdot");
    dot.setAttribute("style", "background:" + (colorOf[r.name] || OTHER_COLOR));
    chipCell.append(dot);

    const shareCell = el("td", "num share");
    const barWrap = el("span", "minibar");
    const fill = el("span", "minifill");
    fill.setAttribute("style",
      "width:" + (topShare ? (share / topShare) * 100 : 0).toFixed(1) + "%;" +
      "background:" + (colorOf[r.name] || OTHER_COLOR));
    barWrap.append(fill);
    shareCell.append(el("span", "sharenum", pct(share)), barWrap);

    tr.append(chipCell, el("td", "unit", r.name),
              el("td", "num", nf(r.active)),
              el("td", "num big", nf(r.hires)), shareCell);
    table.append(tr);
  });

  const sum = el("tr", "sum");
  sum.append(el("td", "dotcell", ""), el("td", "unit", "סך הכול"),
             el("td", "num", nf(sumActive)),
             el("td", "num big", nf(sumHires)),
             el("td", "num share", "100.0%"));
  table.append(sum);

  /* כל שורה מעוגלת בפני עצמה, ולכן סכום השורות יכול להיות קטן במעט
     מהמספר הראשי. אומרים את זה במפורש - מספר שאינו מסתדר עם הכרטיס
     שמעליו נראה כמו תקלה. */
  const whole = unitHires(counts);
  const diff = whole - sumHires;
  $("unitGap").textContent = diff === 0 ? "" :
    "סכום השורות הוא " + nf(sumHires) + ", והמספר הראשי הוא " + nf(whole) +
    ". ההפרש, " + nf(Math.abs(diff)) + ", הוא עיגול: כל שורה מעוגלת " +
    "בפני עצמה, ויש כאן " + nf(rows.length) + " שורות.";

  setInfo("unitInfo", "גיוס לפי יחידה",
    ["הכרטיס נבנה מעמודת היחידה שבקובץ שנטען. לכל יחידה רצה בדיוק אותה " +
     "זרימה קדימה שרצה על הסך הכול: כמה מועמדים פעילים יש לה בכל שלב, " +
     "וכמה מהם צפויים להתגייס.",
     "הטבעת מציגה את חלוקת הגיוסים הצפויים. יחידה שחלקה קטן מ-5% " +
     "מתאחדת עם השאר תחת «" + OTHER_LABEL + "», כדי שהתמונה תישאר " +
     "קריאה; בטבלה שלצידה מופיעות כל היחידות, אחת אחת.",
     "הכרטיס משתנה יחד עם שאר העמוד - בורר האוכלוסייה ותאריך היעד חלים " +
     "עליו בדיוק כמו על המספר הראשי." +
     (targetDate ? " כאן מוצג מה שנכנס עד " + fmtDay(targetDate) + "." : ""),
     "כל שורה מעוגלת בפני עצמה, ולכן סכום השורות יכול להיבדל בכמה " +
     "מגויסים מהמספר הראשי שבראש העמוד. ההפרש, כשהוא קיים, כתוב מתחת " +
     "לטבלה.",
     "מועמד בלי יחידה בקובץ מופיע כ«" + UNKNOWN_UNIT + "». מועמד שרשום " +
     "בשתי יחידות נספר בשתיהן."]);
  return true;
}

/* ---------- כרטיס התוצאה ---------- */
function renderHero(cap, value, note, infoTitle, infoText) {
  $("heroCap").textContent = cap;
  $("heroNote").textContent = note;
  countUp($("heroValue"), value, 900);
  $("stickyLabel").textContent = cap;
  $("stickyValue").textContent = nf(value);
  setInfo("heroInfo", infoTitle, infoText);
}

/* ------------------------------------------------------------------ *
 *  שורת שלב אחת. זה כל מה שיש בגוף העמוד:                             *
 *  שם | ⓘ | אחוז מעבר | פס | כמות, ומתחת לכמות הזמן או הקצב.          *
 * ------------------------------------------------------------------ */
function chainRow(body, o, i) {
  const row = el("div", "fstage" + (o.cls ? " " + o.cls : ""));

  const head = el("div", "fhead");
  head.append(el("span", "fname", o.label));
  if (o.info) head.append(infoBtn(o.infoTitle || o.label, o.info));
  if (o.chip) head.append(el("span", o.chipCls || "fpct", o.chip));

  const track = el("div", "ftrack");
  /* רוחב הפס אינו כמות אלא הסיכוי להתגייס מהשלב הזה: שורת הגיוס
     מלאה תמיד, וכל שלב שלפניה מוכפל בשיעורי המעבר שנותרו עד הגיוס.
     בקשה מפורשת של המשתמש. הכמות ממשיכה להופיע כמספר שמימין,
     והצבעים שבתוך הפס נשארים חלוקת שני הנתיבים באותו שלב. */
  const fill = o.fill === undefined || o.fill === null
    ? (o.value / (o.max || 1))
    : o.fill;
  const span = Math.max(0, Math.min(1, fill)) * 100;
  const width = span.toFixed(2);
  if (o.split) {
    const bar = el("div", "fbar split");
    const segNew = el("div", "fseg newpop");
    const segKnown = el("div", "fseg knownpop");
    bar.append(segNew, segKnown);
    track.append(bar);
    const both = (o.split.new || 0) + (o.split.known || 0);
    const shareNew = both > 0 ? (o.split.new || 0) / both : 1;
    const wNew = (span * shareNew).toFixed(2);
    const wKnown = (span * (1 - shareNew)).toFixed(2);
    if (o.split.new > 0) segNew.classList.add("on");
    if (o.split.known > 0) segKnown.classList.add("on");
    if (o.fillTitle) bar.setAttribute("title", o.fillTitle);
    later(() => {
      segNew.style.width = wNew + "%";
      segKnown.style.width = wKnown + "%";
    }, 70 + i * 60);
  } else {
    const bar = el("div", "fbar");
    if (o.value > 0) bar.classList.add("on");
    if (o.fillTitle) bar.setAttribute("title", o.fillTitle);
    track.append(bar);
    later(() => { bar.style.width = width + "%"; }, 70 + i * 60);
  }

  const val = el("div", "fval");
  const n = el("span", "n");
  if (o.text !== undefined) {
    n.textContent = o.text;
    val.classList.add("blocked");
  } else {
    countUp(n, o.value, 850);
  }
  val.append(n);
  if (o.small) val.append(el("small", null, o.small));

  row.append(head, track, val);
  body.append(row);
}

/* מה נכתב מתחת לכמות: קצב נדרש כשיש מועד, וזמן ההגעה כשיש מדידה. */
function rowFoot(perDay, daysMedian, dated, startDate) {
  if (dated) {
    const p = fmtPace(perDay);
    if (p) return p;
  }
  if (daysMedian !== null && daysMedian !== undefined && daysMedian > 0) {
    return startDate ? fmtDay(shiftDays(startDate, daysMedian))
                     : Math.round(daysMedian) + " ימים";
  }
  return null;
}

/* ------------------------------------------------------------------ *
 *  שלוש התיבות: שני הנתיבים והתוצאה. זהות בשני הכיוונים בכוונה.        *
 * ------------------------------------------------------------------ */
function renderLanes(id, known, knownWhy, newPop, newWhy, totalName, total, totalWhy) {
  const lanes = $(id);
  lanes.innerHTML = "";
  const box = (cls, name, val, why) => {
    const d = el("div", "lanebox " + cls);
    const h = el("div", "lname");
    h.append(el("span", null, name), infoBtn(name, why));
    d.append(h, el("div", "lval", nf(val)));
    lanes.append(d);
  };
  box("known", known.label + " · יחס 1:" + known.ratio, known.hires, knownWhy);
  box("newp", newPop.label + " · יחס 1:" + Math.round(newPop.ratio),
      newPop.hires, newWhy);
  box("tot", totalName, total, totalWhy);
}

/* ------------------------------------------------------------------ *
 *  ציור שרשרת התזרים. משמש את שני הכיוונים, ולכן הם נראים אותו דבר.   *
 * ------------------------------------------------------------------ */
function renderChain(bodyId, plan, opts) {
  const body = $(bodyId);
  body.innerHTML = "";
  const dated = !plan.annual;
  const startDate = opts.startDate || null;
  const denom = opts.denom || plan.rows[0].total;

  // כשמוצג רק מה שנכנס בחלון, גם הפסים וגם הכמויות באים משם
  const inTime = !!opts.inTime;
  const shownVal = r => (inTime && r.total_in_time !== null &&
                         r.total_in_time !== undefined)
    ? r.total_in_time : r.total;
  const all = plan.rows.map(shownVal)
    .concat(plan.aside.map(shownVal))
    .concat((plan.extra || []).map(x => x.total));
  const max = Math.max.apply(null, all.concat([1]));

  /* רוחב הפס = הסיכוי להתגייס מהשלב. שורת הגיוס מלאה (100%), וכל
     שלב שלפניה הוא מכפלת שיעורי המעבר שנותרו עד הגיוס. */
  const last = plan.rows.length - 1;
  const cum = new Array(plan.rows.length);
  for (let k = last; k >= 0; k--) {
    if (k === last) { cum[k] = 1; continue; }
    const rate = plan.rows[k].rate_to_next;
    cum[k] = (rate === null || rate === undefined) ? cum[k + 1] : rate * cum[k + 1];
  }
  const cumOf = key => {
    for (let k = 0; k < plan.rows.length; k++) if (plan.rows[k].key === key) return cum[k];
    return cum[0];
  };
  const cumOfLabel = label => {
    for (let k = 0; k < plan.rows.length; k++) if (plan.rows[k].label === label) return cum[k];
    return cum[0];
  };
  const fillWhy = share =>
    " רוחב הפס: " + pct(share) + " - זהו הסיכוי להתגייס ממי שנמצא " +
    "בשלב הזה, לפי שיעורי המעבר של התזרים. שורת הגיוס מלאה תמיד.";

  let i = 0;

  // שלב שאינו על השרשרת: מוצג ראשון, כנקודת הכניסה
  (plan.extra || []).forEach(x => {
    const xFill = (x.via_rate || 0) * cumOfLabel(x.via_label);
    chainRow(body, {
      label: x.label, cls: "source", chip: "הוזן", chipCls: "chip",
      value: x.total, max: max, fill: xFill,
      fillTitle: "הסיכוי להתגייס מכאן: " + pct(xFill),
      small: rowFoot(x.per_day, 0, dated, startDate),
      info: "נקודת הכניסה. השלב הזה אינו מופיע בתזרים הליך הגיוס " +
        plan.year + ", ולכן המעבר ממנו ל«" + x.via_label + "» נלקח " +
        "מהמדידה בקבצים: " + pct(x.via_rate) + ". משם והלאה היחסים הם " +
        "של התזרים." + fillWhy(xFill)
    }, i++);
  });

  const asideAfter = {};
  plan.aside.forEach(a => {
    if (a.before_start) {
      const aFill = cumOf(a.after);
      chainRow(body, {
        label: a.label, cls: "aside source", chip: "הוזן", chipCls: "chip",
        value: a.total, max: max, fill: aFill,
        fillTitle: "הסיכוי להתגייס מכאן: " + pct(aFill),
        small: rowFoot(a.per_day, 0, dated, startDate),
        info: "נקודת הכניסה. מרכז הערכה הוא תחנת צד ואינו בשרשרת: " +
          "בתזרים " + plan.year + " הוא מקבל " + pct(a.share_of_host) +
          " מ«" + Engine.label(a.after) + "», ומכאן ההמשך נגזר לפי " +
          "השרשרת. השלבים שלפניו אינם מוצגים - הגזירה היא קדימה בלבד." +
          fillWhy(aFill)
      }, i++);
      return;
    }
    if (!asideAfter[a.after]) asideAfter[a.after] = [];
    asideAfter[a.after].push(a);
  });

  plan.rows.forEach((r, idx) => {
    const prev = idx > 0 ? plan.rows[idx - 1] : null;
    const chip = prev && prev.rate_to_next
      ? pct(prev.rate_to_next) + " מ«" + prev.label + "»"
      : (r.is_source ? "הוזן" : null);
    const chipCls = (!prev || !prev.rate_to_next) && r.is_source ? "chip" : "fpct";

    let why = "";
    if (r.known) {
      why += nf(r.new) + " " + plan.new.label + " (כחול)  +  " +
             nf(r.known) + " " + plan.known.label + " (כתום). ";
    } else {
      why += nf(r.new) + " " + plan.new.label + " בלבד - " +
             plan.known.label + " אינה עוברת בשלב הזה. ";
    }
    if (prev && prev.rate_to_next) {
      why += "מ«" + prev.label + "» מגיעים לכאן " + pct(prev.rate_to_next) +
             " מהאוכלוסייה החדשה, לפי תזרים " + plan.year + ". ";
    }
    if (r.rate_to_next) {
      why += "מכאן ממשיכים ל«" + Engine.label(r.to_next) + "» " +
             pct(r.rate_to_next) + ". ";
    }
    if (opts.sources && r.sources && r.sources.length) {
      why += "מקור הכמות: " + r.sources.map(s =>
        s.from === r.key
          ? nf(s.count) + " שהוזנו ב«" + s.from_label + "»"
          : nf(s.count) + " מתוך " + nf(s.from_count) + " ב«" + s.from_label + "»"
      ).join("  +  ") + ". ";
    }
    if (opts.baseline && r.baseline !== undefined) {
      why += "ב-" + plan.year + " עברו כאן " + nf(r.baseline) + ", וכאן " +
             nf(r.total) + " - פי " + r.pace.toFixed(2) + ". ";
    }
    if (dated) {
      why += "בחלון של " + nf(plan.span_days) + " ימים זהו קצב של " +
             fmtPace(r.per_day) + ". ";
    }
    if (r.days_median !== null && r.days_median !== undefined && r.days_median > 0) {
      why += "חציון " + Math.round(r.days_median) + " ימים מנקודת הכניסה " +
             "ועד כאן, נמדד בקבצים על מי שעבר את המסלול בפועל.";
    }

    if (inTime) {
      why += " עד " + fmtDay(shiftDays(todayDay(), plan.span_days)) +
             " יגיעו לכאן " + nf(shownVal(r)) + " מתוך " + nf(r.total) +
             " שיגיעו בסופו של דבר - השאר מאוחרים מהתאריך.";
    }
    why += fillWhy(cum[idx]);
    chainRow(body, {
      label: r.label, cls: r.is_hire ? "hire" : (r.is_source ? "source" : ""),
      chip: chip, chipCls: chipCls,
      value: shownVal(r), max: max, fill: cum[idx],
      fillTitle: "הסיכוי להתגייס מכאן: " + pct(cum[idx]),
      split: inTime
        ? { new: (r.new_in_time === null ? r.new : r.new_in_time),
            known: r.known_in_time === null ? r.known : r.known_in_time }
        : { new: r.new, known: r.known },
      small: rowFoot(inTime ? shownVal(r) / plan.span_days : r.per_day,
                     r.days_median, dated, startDate),
      info: why
    }, i++);

    (asideAfter[r.key] || []).forEach(a => {
      chainRow(body, {
        label: "↳ " + a.label, cls: "aside", infoTitle: a.label,
        chip: pct(a.share_of_host) + " מ«" + Engine.label(a.after) + "»",
        value: shownVal(a), max: max, fill: cumOf(a.after),
        fillTitle: "הסיכוי להתגייס מכאן: " + pct(cumOf(a.after)),
        small: rowFoot(inTime ? shownVal(a) / plan.span_days : a.per_day,
                       a.days_median, dated, startDate),
        info: "תחנת צד, לא בשרשרת. בתזרים " + plan.year + " היא מקבלת " +
          pct(a.share_of_host) + " מ«" + Engine.label(a.after) + "», וכמעט " +
          "כל מי שמגיע אליה ממשיך הלאה. היא אינה משתתפת בחישוב ואינה " +
          "תחנת חובה בדרך לגיוס." + fillWhy(cumOf(a.after))
      }, i++);
    });
  });
  return denom;
}

/* ------------------------------------------------------------------ *
 *  כיוון א': כמה צריך כדי לגייס את היעד                                *
 * ------------------------------------------------------------------ */
function renderConstrained(target, targetDate, days) {
  const plan = Engine.constrainedPlan(target, days, NEW_ONLY);
  if (!plan) return false;

  const spanText = plan.annual
    ? "שנה שלמה (365 יום)"
    : "נותרו " + fmtSpan(plan.span_days) + ", עד " + fmtDay(targetDate);

  renderLanes("constraintLanes",
    plan.known,
    "חלקה היחסי של האוכלוסייה המוכרת ביעד: " +
      pct(plan.known.hires / plan.target) + " מ-" + nf(plan.target) +
      " הגיוסים, לפי חלקה בתרשים. היא מגיעה ביחס 1:1, אינה עוברת בהליך " +
      "המיון ולכן אינה דורשת הגשות. " +
      (plan.annual
        ? "יש לה תקרה: " + nf(plan.known.per_year) + " גיוסים בשנה, ומעליה " +
          "כל התוספת נופלת על האוכלוסייה החדשה."
        : "התקרה שלה נחתכת לפי אורך החלון - ב-" + nf(plan.span_days) +
          " ימים היא " + nf(Math.round(plan.known.per_year *
            plan.span_days / 365)) + " בלבד, וזו הסיבה שחלון קצר מגדיל " +
          "את דרישת ההגשות."),
    plan.new,
    "כל השאר. אלה הגיוסים היחידים שנגזרים מכמות ההגשות, בשיעור " +
      pct(plan.new.hire_rate) + " מהגשה לגיוס.",
    plan.annual ? "סך הגיוסים" : "גיוסים עד התאריך", plan.target,
    "התיבה הזו מציגה תמיד מספר גיוסים, בדיוק כמו הכרטיס שלמעלה. " +
      "כדי לגייס " + nf(plan.target) + " ב" + spanText + " צריך " +
      nf(plan.submissions) + " הגשות" +
      (plan.annual ? "." : ", בקצב של " + fmtPace(plan.rows[0].per_day) + ".") +
      " כמות ההגשות מופיעה בשורה שמתחת למספר הראשי ובשורת ההגשות שבמשפך.");

  renderChain("constraintBody", plan, { baseline: true });

  const info = [
    "היעד: " + nf(plan.target) + " גיוסים ב" + spanText + ". התשובה: " +
      nf(plan.submissions) + " הגשות" +
      (plan.annual ? "." : ", כלומר " + fmtPace(plan.rows[0].per_day) + "."),
    "היחסים בין השלבים נלקחו מתזרים הליך הגיוס " + plan.year + " שהתקבל " +
      "בתרשים, ולא מרישום הפעילויות. הרישום חסר - כמחצית מהמגויסים אינם " +
      "מופיעים בו כלל - ולכן הוא נותן יחסים מנופחים.",
    "הגיוסים מפוצלים לשני נתיבים, ורק אחד מהם גדל עם ההגשות. כחול הוא " +
      "האוכלוסייה החדשה, שעוברת את כל הליך המיון; כתום היא האוכלוסייה " +
      "המוכרת, שמגיעה ביחס 1:1, אינה עוברת מיון ואינה ניתנת להגדלה."
  ];
  if (!plan.annual) {
    info.push("הנתיב המוכר מתחלק אחיד על פני השנה. בחלון של " +
      nf(plan.span_days) + " ימים הוא תורם " + nf(plan.known.hires) +
      " גיוסים בלבד, ולכן שאר היעד - " + nf(plan.new.hires) + " גיוסים - " +
      "חייב לבוא מהמשפך. ככל שהחלון קצר יותר, כך דרישת ההגשות גדלה.");
    info.push("מתחת לכל כמות כתוב הקצב הנדרש: כמה מועמדים צריך להכניס " +
      "לאותו שלב ליום, ובשלבים הדקים - לשבוע או לחודש.");
  }
  info.push("שיעורי המעבר בשרשרת חושבו על האוכלוסייה החדשה בלבד, מפני " +
    "שהאוכלוסייה המוכרת אינה עוברת סינון.");
  if (plan.known.hires < plan.target * 0.43) {
    info.push("מעל " + nf(Math.round(plan.known.per_year / 0.43048)) +
      " גיוסים בשנה, האוכלוסייה המוכרת מגיעה לתקרה שלה - " +
      nf(plan.known.hires) + " - וכל התוספת מעליה נופלת על האוכלוסייה " +
      "החדשה. לכן הגיוסים גדלים פי " + plan.target_growth.toFixed(2) +
      " אך ההגשות פי " + plan.growth.toFixed(2) + ".");
  } else {
    info.push("האוכלוסייה המוכרת מהווה " + pct(plan.known.hires / plan.target) +
      " מהיעד, בדיוק כחלקה בתרשים. היא אינה מספר קבוע שנדבק ליעד - " +
      "יעד קטן יותר מקבל ממנה פחות.");
  }
  info.push("הכיוון ההפוך עומד על אותה אריתמטיקה: הזנת " +
    nf(plan.submissions) + " ב«הגשות» תחזיר את אותם " + nf(plan.target) +
    " גיוסים.");
  setInfo("constraintInfo", "כמה צריך כדי לגייס את היעד", info);
  return true;
}

/* ------------------------------------------------------------------ *
 *  כיוון ב': כמה יתגייסו מהכמויות שהוזנו                               *
 *  ההיפוך המדויק של הכיוון הראשון. האוכלוסייה המוכרת נספרת כאן פעם     *
 *  אחת - בלעדיה 60,000 הגשות החזירו 1,923 גיוסים במקום כ-3,300.        *
 * ------------------------------------------------------------------ */
function renderFlow(counts, targetDate, days) {
  const plan = Engine.constrainedCombine(counts, days, NEW_ONLY);
  if (!plan) return null;

  const spanText = plan.annual
    ? "שנה שלמה (365 יום)"
    : "נותרו " + fmtSpan(plan.span_days) + ", עד " + fmtDay(targetDate);
  const entryNames = plan.entries.map(e => "«" + e.label + "»").join(" ו-");

  const first = plan.entries[0];
  const blended = Engine.blendedRate(first.chain_key, NEW_ONLY);

  /* כשהוזן תאריך יעד, הכרטיס הזה מציג אך ורק את מה שמספיק להיכנס
     בתוך החלון - בדיוק המספר שבכרטיס הכחול. הצגת סך הגיוסים העתידי
     לצד מספר אחר בכרטיס הראשי היא מה שנראה כמו שני מחשבונים. */
  const timed = !plan.annual && plan.hires_in_time !== null &&
                plan.hires_in_time !== undefined;
  const laneKnown = timed
    ? { label: plan.known.label, ratio: plan.known.ratio,
        per_year: plan.known.per_year, hires: plan.known_in_time }
    : plan.known;
  const laneNew = timed
    ? { label: plan.new.label, ratio: plan.new.ratio,
        hire_rate: plan.new.hire_rate, hires: plan.new_in_time }
    : plan.new;
  const laneTotal = timed ? plan.hires_in_time : plan.hires;

  renderLanes("flowLanes",
    laneKnown,
    "החלק מהכמות שהוזנה ששייך לאוכלוסייה המוכרת, לפי התמהיל של השלב: " +
      pct(first.known_share) + " מהנפח ב«" + first.chain_label + "» הם " +
      "מוכרים, והם מתגייסים ביחס 1:1. הנתיב הזה אינו יכול לחרוג מ-" +
      nf(plan.known.per_year) + " גיוסים בשנה" +
      (plan.annual ? "." : ", כלומר " + nf(plan.known.hires) + " בחלון של " +
        nf(plan.span_days) + " ימים. הוא מתחלק אחיד על פני החלון, ולכן " +
        "כולו נכנס בתוכו."),
    laneNew,
    "כל השאר. הם עוברים את הליך המיון, לפי שיעורי המעבר של תזרים " +
      plan.year + "." +
      (timed ? " מוצג כאן רק מי שמספיק להתגייס תוך " + nf(plan.span_days) +
        " ימים: " + nf(plan.new_in_time) + " מתוך " + nf(plan.new.hires) +
        " שיתגייסו בסופו של דבר." : ""),
    timed ? "גיוסים עד התאריך" : "סך הגיוסים", laneTotal,
    nf(laneNew.hires) + " מהמשפך  +  " + nf(laneKnown.hires) +
      " מהנתיב המוכר = " + nf(laneTotal) + " גיוסים ב" + spanText + "." +
      (timed ? " זהו בדיוק המספר שבכרטיס שלמעלה, ולא סך הגיוסים העתידי." : "") +
      (blended && !timed ? " שיעור ההמרה המשוקלל מ«" + first.chain_label +
        "» ועד גיוס הוא " + pct(blended) + "." : ""));

  renderChain("flowBody", plan, {
    sources: true, startDate: todayDay(), inTime: timed
  });

  const info = [
    "כמה יתגייסו מהכמות שהוזנה ב" + entryNames + ", ב" + spanText + ": " +
      nf(plan.hires) + " גיוסים.",
    blended
      ? "החישוב הוא הכמות כפול שיעור ההמרה המשוקלל של השלב: " +
        nf(first.count) + " כפול " + pct(blended) + ". השיעור הזה כבר " +
        "מגלם בתוכו את האוכלוסייה המוכרת - היא חלק מהתמהיל של השלב, " +
        "ולא מספר קבוע שנדבק לכל תשובה."
      : "",
    "הפיצול בין שני הנתיבים הוא יחסי: " + pct(first.known_share) +
      " מהנפח ב«" + first.chain_label + "» הם האוכלוסייה המוכרת, שמתגייסת " +
      "ביחס 1:1, והשאר עוברים את הליך המיון. לכן " + nf(plan.new.hires) +
      " מהגיוסים באים מהמשפך ו-" + nf(plan.known.hires) + " מהנתיב המוכר.",
    "יש תקרה אחת: הנתיב המוכר אינו יכול לחרוג מ-" +
      nf(plan.known.per_year) + " גיוסים בשנה. כמות גדולה מהנפח השנתי " +
      "הטבעי מקבלת את התקרה, וכל מה שמעליה נופל על האוכלוסייה החדשה - " +
      "וזה מה ששומר על ההיפוך המדויק מול הכיוון השני.",
    "הכיוון ההפוך עומד על אותה אריתמטיקה: יעד של " + nf(plan.hires) +
      " גיוסים יחזיר בדיוק את הכמות שהוזנה.",
    "הכמויות באות מהתזרים. הזמנים שמתחת לכל כמות נמדדו בקבצים, על " +
      "מועמדים שעברו את המסלול בפועל, והם חציון - מחצית מגיעים מוקדם " +
      "יותר ומחציתם מאוחר יותר."
  ];
  if (!plan.annual) {
    info.push("מתחת לכל כמות כתוב הקצב: כמה מועמדים עוברים באותו שלב " +
      "ליום בתוך החלון שנותר.");
  }
  setInfo("flowInfo", "כמה יגיעו לכל שלב", info);
  return plan;
}

/* ------------------------------------------------------------------ *
 *  כמה עוד צריך: היעד פחות מה שכבר בדרך, על אותו תזרים                *
 * ------------------------------------------------------------------ */
function renderGapPlan(counts, target, targetDate, days) {
  const plan = Engine.constrainedGap(counts, target, days, NEW_ONLY);
  const body = $("gapPlanBody");
  body.innerHTML = "";
  if (!plan) return false;

  const spanText = plan.annual ? "שנה שלמה" : "עד " + fmtDay(targetDate);

  if (plan.gap <= 0) {
    $("gapPlanSub").textContent =
      "כבר בדרך: " + nf(plan.have) + " · היעד: " + nf(target) +
      " · עודף: " + nf(-plan.gap);
    setInfo("gapPlanInfo", "כמה עוד צריך",
      ["מה שכבר בדרך צפוי להניב " + nf(plan.have) + " גיוסים " + spanText +
       ", והיעד הוא " + nf(target) + ". היעד מושג בלי להכניס אף מועמד חדש."]);
    body.append(el("div", "msg good",
      "אין צורך בתוספת. " + nf(plan.have) + " צפויים מול יעד של " + nf(target) + "."));
    return true;
  }

  $("gapPlanSub").textContent =
    "כבר בדרך: " + nf(plan.have) + " · היעד: " + nf(target) +
    " · חסרים: " + nf(plan.gap);

  setInfo("gapPlanInfo", "כמה עוד צריך",
    ["מה שכבר בדרך צפוי להניב " + nf(plan.have) + " גיוסים " + spanText +
     ", והיעד הוא " + nf(target) + " - ולכן חסרים " + nf(plan.gap) + ".",
     "כל שורה אומרת כמה עוד צריך שיעברו באותו שלב: הנפח שהתכנון דורש " +
     "שם, פחות מה שכבר עובר שם. מה שכבר יש ועוד ההשלמה שווה בדיוק " +
     "לדרישה המלאה בכל שלב.",
     "השורות אינן מצטברות זו לזו - אלו אותם אנשים בשלבים שונים של " +
     "אותו משפך.",
     plan.annual ? "" : "מתחת לכל כמות כתוב הקצב הנדרש בתוך " +
       nf(plan.span_days) + " הימים שנותרו."]);

  const max = Math.max.apply(null, plan.rows.map(r => r.needed_total || 0).concat([1]));
  plan.rows.forEach((r, i) => {
    chainRow(body, {
      label: r.label,
      chip: r.have ? "יש " + nf(r.have) + " מתוך " + nf(r.needed_total) : null,
      value: r.required, max: max,
      split: { new: r.required, known: 0 },
      small: plan.annual ? null : fmtPace(r.per_day),
      info: "כדי לגייס " + nf(plan.target) + " צריך ש-" + nf(r.needed_total) +
        " יעברו ב«" + r.label + "». כבר עוברים שם " + nf(r.have) + ", ולכן " +
        "חסרים " + nf(r.required) + ". שיעור ההמרה המשוקלל מהשלב הזה ועד " +
        "גיוס הוא " + pct(r.rate) + "." +
        (plan.annual ? "" : " בחלון של " + nf(plan.span_days) + " ימים " +
          "התוספת היא " + fmtPace(r.per_day) + ".")
    }, i);
  });
  return true;
}

/* ------------------------------------------------------------------ *
 *  מתי יגיעו לכל שלב - ציר זמן, נקודה לכל שלב                          *
 *  הכמויות מהתזרים, הזמנים מהמדידה בקבצים.                             *
 * ------------------------------------------------------------------ */
function renderWhen(m, targetDate) {
  const body = $("whenBody");
  body.innerHTML = "";
  if (!m || !m.rows.length) return false;

  const start = todayDay();
  const maxDay = Math.max.apply(null,
    m.rows.map(r => r.days_median || 0).concat([1]));
  const tl = el("div", "tl");

  m.rows.forEach((r, i) => {
    const row = el("div", "tlrow" +
      (r.is_hire ? " hire" : r.is_aside ? " aside" : ""));

    const head = el("div", "tlhead");
    const name = el("div", "tlname");
    name.append(el("span", null, (r.is_aside ? "↳ " : "") + r.label),
      infoBtn(r.label, nf(r.count) + " מועמדים צפויים להגיע ל«" + r.label +
        "», בחציון " + Math.round(r.days_median) + " ימים מנקודת הכניסה - " +
        "כלומר סביב " + fmtDay(shiftDays(start, r.days_median)) + ". " +
        "הכמות באה מתזרים הליך הגיוס; הזמן נמדד בקבצים על מועמדים שעברו " +
        "את המסלול בפועל, והוא חציון: מחצית מגיעים מוקדם יותר ומחציתם " +
        "מאוחר יותר." +
        (r.known ? " " + nf(r.known) + " מהם הם האוכלוסייה המוכרת, " +
          "שאינה עוברת מיון ומתחלקת אחיד על פני החלון." : "")));
    head.append(name);
    head.append(el("div", "tlcount", nf(r.count) + " מועמדים · " +
      fmtDay(shiftDays(start, r.days_median))));

    const track = el("div", "tltrack");
    const fill = el("div", "tlfill");
    const dot = el("div", "tldot");
    track.append(fill, dot);
    const w = ((r.days_median || 0) / maxDay) * 100;
    later(() => {
      fill.style.width = w.toFixed(1) + "%";
      dot.style.insetInlineStart = w.toFixed(1) + "%";
      dot.classList.add("on");
    }, 90 + i * 90);

    const day = el("div", "tlday", Math.round(r.days_median));
    day.append(el("small", null, "ימים"));

    row.append(head, track, day);
    tl.append(row);
  });

  const axis = el("div", "tlaxis-wrap");
  const axisLine = el("div", "tlaxis");
  axisLine.append(el("span", null, "היום"),
                  el("span", null, "יום " + Math.round(maxDay)));
  axis.append(el("div"), axisLine, el("div"));
  tl.append(axis);
  body.append(tl);

  setInfo("whenInfo", "מתי יגיעו לכל שלב",
    ["הזמן זורם מימין לשמאל, בכיוון הקריאה. כל שלב הוא נקודה שממוקמת " +
     "לפי חציון הימים מנקודת הכניסה ועד אליו.",
     "הכמויות באות מתזרים הליך הגיוס, בדיוק כמו במשפך שלמעלה. הזמנים " +
     "נמדדו בקבצים על מועמדים שעברו את המסלול בפועל.",
     "חציון פירושו שמחצית מהמועמדים מגיעים מוקדם יותר ומחציתם מאוחר " +
     "יותר, ולא שכולם מגיעים באותו יום. התאריכים מניחים שהמועמדים " +
     "נמצאים היום בשלב שהוזן.",
     "מרכז הערכה מסומן בחץ: הוא תחנת צד ואינו תחנת חובה בדרך לגיוס.",
     targetDate ? "תאריך היעד שהוזן הוא " + fmtDay(targetDate) + "." : ""]);
  return true;
}

/* ------------------------------------------------------------------ *
 *  כמה בכל שלב, ומתי - טבלה אחת, שורה לכל שלב על פני חלונות הזמן      *
 *  סכום התאים בשורה שווה בדיוק לסך הכול. טבלה שאינה מסתכמת נראית      *
 *  כמו טעות.                                                          *
 * ------------------------------------------------------------------ */
function renderMatrix(m, targetDate, cutoffDays) {
  const body = $("matrixBody");
  body.innerHTML = "";
  if (!m || !m.rows.length) return false;

  const start = todayDay();
  const timed = cutoffDays !== null && cutoffDays !== undefined;

  const head = el("tr");
  head.append(el("th", null, "שלב"));
  m.buckets.forEach(b => {
    const late = timed && b.min_days > cutoffDays;
    head.append(el("th", late ? "late" : null, b.label));
  });
  head.append(el("th", null, "סך הכול"), el("th", null, "חציון ימים"));
  body.append(head);

  m.rows.forEach(r => {
    const tr = el("tr", r.is_hire ? "hire" : r.is_aside ? "aside" : "");
    const stage = el("td", "stage");
    const cell = el("div", "cellname");
    cell.append(el("span", null, r.label), infoBtn(r.label,
      nf(r.count) + " מועמדים ב«" + r.label + "», מפוזרים על חלונות הזמן " +
      "לפי התפלגות הזמנים שנמדדה בקבצים. " +
      m.buckets.map((b, i) => b.label + ": " + nf(r.cells[i].count)).join(" · ") +
      ". סכום החלונות שווה בדיוק לסך הכול." +
      (r.known ? " " + nf(r.known) + " מהם הם האוכלוסייה המוכרת, שמתחלקת " +
        "אחיד על פני החלון." : "")));
    stage.append(cell);
    tr.append(stage);
    r.cells.forEach((c, i) => {
      const late = timed && m.buckets[i].min_days > cutoffDays;
      tr.append(el("td", "num" + (late ? " late" : ""), nf(c.count)));
    });
    tr.append(el("td", "num big hi", nf(r.count)));
    tr.append(el("td", "num", Math.round(r.days_median)));
    body.append(tr);
  });

  setInfo("matrixInfo", "כמה בכל שלב, ומתי",
    ["שורה לכל שלב, עמודה לכל חלון זמן. התא הוא כמה מועמדים יגיעו לשלב " +
     "ההוא בתוך החלון ההוא.",
     "סכום התאים בשורה שווה בדיוק לעמודת «סך הכול»: הפיזור מעוגל על " +
     "הסכום הרץ, כדי שהטבלה תמיד תסתכם.",
     "החלונות נמדדים מהיום: " + m.buckets.map(b => b.label + " = " +
       (b.max_days === null ? "אחרי " + fmtDay(shiftDays(start, b.min_days))
                            : "עד " + fmtDay(shiftDays(start, b.max_days)))
     ).join(" · ") + ".",
     timed ? "החלונות שכולם אחרי " + fmtDay(targetDate) + " מסומנים בהיר - " +
             "הם אינם נספרים במספר שבראש העמוד." : ""]);
  return true;
}

/* ------------------------------------------------------------------ *
 *  מתי יתגייסו                                                        *
 * ------------------------------------------------------------------ */
function renderTimeline(counts, days, targetDate) {
  const body = $("timelineBody");
  body.innerHTML = "";
  const merged = Engine.constrainedTimeline(counts, days, NEW_ONLY);
  if (!merged || !merged.total) return false;

  const start = todayDay();
  const byKey = {};
  DATA.time_buckets.forEach(b => { byKey[b.key] = b; });

  const bars = el("div", "bars");
  const maxHires = Math.max.apply(null, merged.rows.map(r => r.hires).concat([1]));

  merged.rows.forEach((r, i) => {
    const b = byKey[r.key];
    const row = el("div", "bar-row");

    const name = el("div");
    const title = el("div", "barname");
    const why = r.sources.length
      ? r.sources.map(s => s.from === null
          ? nf(s.hires) + " מ«" + s.from_label + "» - הנתיב הקבוע, שמתחלק " +
            "אחיד על פני החלון"
          : nf(s.hires) + " מתוך " + nf(s.from_count) + " שהוזנו ב«" +
            s.from_label + "» (" + pct(s.share) + " ממי שיתגייס מהם)"
        ).join("  +  ") + "."
      : "אין מגויסים בחלון הזה.";
    title.append(el("span", null, r.label), infoBtn(r.label, why));
    name.append(title);
    name.append(el("small", "tlcount", b.max_days === null
      ? "אחרי " + fmtDay(shiftDays(start, b.min_days))
      : "עד " + fmtDay(shiftDays(start, b.max_days))));

    const track = el("div", "bar-track");
    const fill = el("div", "bar-fill");
    track.append(fill);
    later(() => { fill.style.width = ((r.hires / maxHires) * 100).toFixed(1) + "%"; },
          90 + i * 60);

    const val = el("div", "bar-val");
    const vn = el("span", "n");
    countUp(vn, r.hires, 850);
    val.append(vn, el("small", "pctchip", pct(r.share)));

    row.append(name, track, val);
    bars.append(row);
  });

  body.append(bars);

  setInfo("timelineInfo", "מתי יתגייסו",
    [nf(merged.total) + " גיוסים צפויים, מפוזרים על פני הזמן.",
     nf(merged.new) + " מהם הם האוכלוסייה החדשה, והם מתפזרים לפי התפלגות " +
     "הזמנים שנמדדה בקבצים לשלב שממנו הם נגזרים.",
     nf(merged.known) + " מהם הם האוכלוסייה המוכרת. היא אינה נגזרת משום " +
     "שלב ואינה עוברת מיון, ולכן היא מתחלקת אחיד על פני החלון.",
     targetDate ? "החלון כולו נמדד עד " + fmtDay(targetDate) + "." : ""]);
  return true;
}

/* ------------------------------------------------------------------ *
 *  משפך הליך הגיוס השנתי, בשתי עמודות זו לצד זו                       *
 *  זהו התרשים עצמו ולא תחזית, ולכן הוא אינו תלוי במה שהוזן. שמאל -    *
 *  כל הנפח כולל האוכלוסייה המוכרת; ימין - האוכלוסייה החדשה בלבד,      *
 *  כלומר מי שבאמת עובר את הליך המיון.                                 *
 * ------------------------------------------------------------------ */
function renderChart() {
  const f = Engine.flowFunnel();
  if (!f) return;

  $("chartAllHead").textContent = "כלל הגיוסים";
  $("chartNewHead").textContent = "אוכלוסייה חדשה בלבד";

  const draw = (bodyId, pick, withKnown) => {
    const body = $(bodyId);
    body.innerHTML = "";
    const all = f.rows.map(r => pick(r).count)
      .concat(f.aside.map(a => pick(a).count));
    const max = Math.max.apply(null, all.concat([1]));

    /* אותו כלל כמו במשפכים שלמעלה: רוחב הפס הוא הסיכוי להתגייס
       מהשלב, ולכן שורת הגיוס מלאה ואין פס ריק. */
    const last = f.rows.length - 1;
    const cum = new Array(f.rows.length);
    for (let k = last; k >= 0; k--) {
      if (k === last) { cum[k] = 1; continue; }
      const nx = pick(f.rows[k + 1]).from_prev;
      cum[k] = (nx === null || nx === undefined) ? cum[k + 1] : nx * cum[k + 1];
    }
    const cumOf = key => {
      for (let k = 0; k < f.rows.length; k++) if (f.rows[k].key === key) return cum[k];
      return cum[0];
    };
    const fillWhy = share =>
      " רוחב הפס: " + pct(share) + " - הסיכוי להתגייס ממי שנמצא בשלב הזה. " +
      "שורת הגיוס מלאה תמיד.";

    const asideAfter = {};
    f.aside.forEach(a => {
      if (!asideAfter[a.after]) asideAfter[a.after] = [];
      asideAfter[a.after].push(a);
    });

    let i = 0;
    f.rows.forEach((r, idx) => {
      const c = pick(r);
      const prev = idx > 0 ? pick(f.rows[idx - 1]) : null;
      const why = "בשנת " + f.year + " עברו כאן " + nf(c.count) +
        (withKnown && r.known
          ? ", מהם " + nf(r.known) + " " + f.known_label + " ו-" +
            nf(c.count - r.known) + " " + f.new_label + "."
          : (withKnown ? " - " + f.known_label + " אינה עוברת בשלב הזה." :
             " " + f.new_label + ", כלומר מי שעובר את הליך המיון.")) +
        (c.from_prev ? " מהשלב הקודם מגיעים לכאן " + pct(c.from_prev) + "." : "") +
        (c.from_first && idx > 0
          ? " מכלל ההגשות זהו " + pct(c.from_first) + "." : "");
      chainRow(body, {
        label: r.label, cls: r.is_hire ? "hire" : (idx === 0 ? "source" : ""),
        chip: c.from_prev ? pct(c.from_prev) : null,
        value: c.count, max: max, fill: cum[idx],
        fillTitle: "הסיכוי להתגייס מכאן: " + pct(cum[idx]),
        small: c.from_first && idx > 0 ? pct(c.from_first) + " מההגשות" : null,
        info: why + fillWhy(cum[idx]), infoTitle: r.label
      }, i++);

      (asideAfter[r.key] || []).forEach(a => {
        const ac = pick(a);
        chainRow(body, {
          label: "↳ " + a.label, cls: "aside", infoTitle: a.label,
          chip: pct(a.share_of_host),
          value: ac.count, max: max, fill: cumOf(a.after),
          fillTitle: "הסיכוי להתגייס מכאן: " + pct(cumOf(a.after)),
          small: ac.from_first ? pct(ac.from_first) + " מההגשות" : null,
          info: "תחנת צד, לא בשרשרת. בתרשים " + f.year + " עברו בה " +
            nf(ac.count) + ", שהם " + pct(a.share_of_host) + " מ«" +
            Engine.label(a.after) + "». היא אינה תחנת חובה בדרך לגיוס." +
            fillWhy(cumOf(a.after))
        }, i++);
      });
    });
  };

  draw("chartAllBody", r => r.all, true);
  draw("chartNewBody", r => r.new, false);

  const hire = f.rows[f.rows.length - 1];
  setInfo("chartInfo", "משפך הליך הגיוס",
    ["זהו תרשים תזרים הליך הגיוס " + f.year + " שהתקבל, ולא תחזית: הוא " +
     "אינו משתנה עם מה שמוזן למעלה. כל היחסים שבמחשבון נגזרים ממנו.",
     "שני המשפכים הם אותה שנה בשתי קריאות. משמאל כל הנפח, כולל «" +
     f.known_label + "»; מימין רק «" + f.new_label + "», כלומר מי שבאמת " +
     "עובר את הליך המיון.",
     "ההבדל ביניהם הוא מה שהופך את החישוב לנכון: «" + f.known_label +
     "» מגיעה ביחס 1:1 ואינה עוברת מיון, ולכן היא " +
     pct(hire.known / hire.all.count) + " מהגיוסים אך רק " +
     pct(f.rows[0].known / f.rows[0].all.count) + " מההגשות. " +
     "בשלבי המיון עצמם - יום מיון מקוון ויום מיון - היא אינה מופיעה כלל.",
     "לצד כל כמות כתוב איזה חלק היא מהשלב הקודם, ומתחתיה איזה חלק היא " +
     "מכלל ההגשות."]);
}

/* --- הערות ובדיקות --- */
function renderNotes(messages) {
  const body = $("gapBody");
  body.innerHTML = "";
  messages.forEach(m => body.append(el("div", "msg " + m.kind, m.text)));
  return messages.length > 0;
}

/* --- חשיפת התוצאות --- */
const ALL_CARDS = ["heroCard", "constraintCard", "flowCard", "gapCardPlan",
                   "whenCard", "matrixCard", "timelineCard", "unitCard",
                   "gapCard"];

function revealResults(cards) {
  $("results").classList.remove("hidden");
  cards.forEach(id => $(id).classList.remove("in"));
  ALL_CARDS.forEach(id => {
    $(id).classList.toggle("hidden", cards.indexOf(id) === -1);
  });

  if (!CAN_ANIMATE) { cards.forEach(id => $(id).classList.add("in")); return; }
  cards.forEach((id, i) => setTimeout(() => $(id).classList.add("in"), 40 + i * 110));

  const results = $("results");
  if (results && typeof results.scrollIntoView === "function") {
    setTimeout(() => results.scrollIntoView({ behavior: "smooth", block: "start" }), 80);
  }
}

/* ------------------------------------------------------------------ *
 *  בורר האוכלוסייה                                                     *
 *  «כלל הגיוסים» הוא ברירת המחדל בכל רענון - בקשה מפורשת. במצב         *
 *  «גיוסים חדשים בלבד» כל החישוב רץ על המשפך של האוכלוסייה החדשה       *
 *  בלבד, ביחס 1:31, בלי הנתיב המוכר.                                   *
 * ------------------------------------------------------------------ */
let NEW_ONLY = false;

function setPopulation(newOnly) {
  NEW_ONLY = !!newOnly;
  $("popAll").classList.toggle("on", !NEW_ONLY);
  $("popNew").classList.toggle("on", NEW_ONLY);
  if (!$("results").classList.contains("hidden")) calculate();
}

/* --- ההרצה הראשית --- */
function calculate() {
  const { counts, target, targetDate, badDate } = readInputs();
  const entered = Engine.stageKeys().filter(k => counts[k] !== null);
  const notes = [];

  DATA.stages.forEach(s => {
    if (!s.has_data && counts[s.key] !== null) {
      notes.push({ kind: "warn", text:
        "הנתון שהוזן ב«" + s.label + "» לא שימש לחישוב: אין לשלב הזה מקור " +
        "נתונים." });
    }
  });

  if (badDate) {
    notes.push({ kind: "warn", text:
      "«" + badDate + "» אינו תאריך תקין ולכן לא נלקח בחשבון." });
  }

  if (!entered.length && target === null) {
    $("results").classList.add("hidden");
    return;
  }

  const rawDays = targetDate === null ? null : daysBetween(todayDay(), targetDate);
  const days = rawDays !== null && rawDays >= 0 ? rawDays : null;
  if (rawDays !== null && rawDays < 0) {
    notes.push({ kind: "warn", text:
      "תאריך היעד שהוזן, " + fmtDay(targetDate) + ", כבר עבר. החישוב נעשה " +
      "על שנה שלמה." });
  }
  const shownDate = days === null ? null : targetDate;

  const cards = ["heroCard"];

  /* --- כיוון א': רק יעד --- */
  if (!entered.length) {
    const cp = Engine.constrainedPlan(target, days, NEW_ONLY);
    if (cp) {
      /* המספר הראשי הוא היעד עצמו, וכמות ההגשות הדרושה יושבת מתחתיו.
         כך הכרטיס הכחול שווה תמיד לשורת הגיוס שבתחתית המשפך - בשני
         המצבים - ואי אפשר לקרוא אותו כשני מספרים שונים. */
      renderHero(
        cp.annual ? "יעד גיוס" : "מגויסים עד " + fmtDay(shownDate),
        target,
        nf(cp.submissions) + " הגשות דרושות" +
          (cp.annual ? ""
            : " · נותרו " + fmtSpan(cp.span_days) + " · " +
              fmtPace(cp.rows[0].per_day)),
        "מאיפה בא המספר הזה",
        ["היעד הוא " + nf(target) + " גיוסים" +
         (cp.annual ? " בשנה" : " עד " + fmtDay(shownDate)) + ", וכדי " +
         "להגיע אליו צריך " + nf(cp.submissions) + " הגשות" +
         (cp.annual ? "." : " בתוך " + nf(cp.span_days) + " הימים שנותרו, " +
           "כלומר " + fmtPace(cp.rows[0].per_day) + "."),
         "כל שורה במשפך אומרת כמה מועמדים צריכים לעבור באותו שלב בתוך " +
         "החלון כדי שהיעד יתקיים, וכל שורה נגזרת מזו שמתחתיה לפי אחוזי " +
         "המעבר של התזרים - עד לשורת הגיוס, שהיא היעד עצמו.",
         nf(cp.known.hires) + " מהגיוסים מגיעים מ«" + cp.known.label +
         "» ואינם עוברים בהליך המיון כלל, ולכן אינם דורשים הגשות. רק " +
         nf(cp.new.hires) + " הגיוסים של «" + cp.new.label + "» נגזרים " +
         "מהמשפך, ביחס 1:" + Math.round(cp.new.ratio) + ".",
         "מפני שהנתיב המוכר קבוע, כל התוספת נופלת על הנתיב שכן גדל: " +
         "הגיוסים גדלים פי " + cp.target_growth.toFixed(2) + " וההגשות פי " +
         cp.growth.toFixed(2) + "."]);
      renderConstrained(target, shownDate, days);
      cards.push("constraintCard");

      /* אותן טבלאות ואותה פריסת זמנים כמו במצב זרימה, בדיוק באותו
         עיצוב. הן נבנות מהכמות שהתכנון דורש בשלב הראשון - וזה עובד
         מפני ששני הכיוונים הם היפוך מדויק זה של זה, ולכן הכמויות
         בטבלאות זהות לאלה שבמשפך שמעליהן. */
      const planCounts = {};
      DATA.stages.forEach(st => { planCounts[st.key] = null; });
      planCounts[cp.rows[0].key] = cp.submissions;
      const pm = Engine.constrainedPlanMatrix(target, days, NEW_ONLY);
      if (renderWhen(pm, shownDate)) cards.push("whenCard");
      if (renderMatrix(pm, shownDate, days)) cards.push("matrixCard");
      if (renderTimeline(planCounts, days, shownDate)) cards.push("timelineCard");

      /* חלון זמן שאינו משנה את הכמות חייב לומר זאת. בלי זה המשתמש
         מזין תאריך, מקבל בדיוק אותו מספר, ואין לו דרך לדעת למה. */
      if (days !== null) {
        const ceiling = cp.known.per_year * cp.span_days / 365;
        const proportional = target * (DATA.annual_flow.known.share_of_hires);
        if (ceiling <= proportional) {
          notes.push({ kind: "flat", text:
            "בחלון של " + nf(cp.span_days) + " ימים הנתיב הקבוע יכול לספק " +
            nf(cp.known.hires) + " גיוסים בלבד, ולכן דרישת ההגשות גדולה " +
            "מזו של אותו יעד בשנה שלמה (" +
            nf(Engine.constrainedPlan(target, null, NEW_ONLY).submissions) + ")." });
        } else {
          const limit = Math.floor(proportional * 365 / cp.known.per_year);
          notes.push({ kind: "flat", text:
            "כמות ההגשות ליעד הזה זהה לזו שבשנה שלמה, ומה שהתאריך משנה " +
            "הוא הקצב: " + fmtPace(cp.rows[0].per_day) + " במקום " +
            fmtPace(Engine.constrainedPlan(target, null, NEW_ONLY).rows[0].per_day) +
            ". הכמות תשתנה רק בחלון קצר מ-" + nf(limit) + " ימים, שבו " +
            "הנתיב הקבוע כבר לא יספיק לחלקו ביעד." });
        }
      }
    } else {
      renderHero("יעד גיוס", target, "", "יעד גיוס",
        "אין מספיק נתונים כדי לגזור את כמות ההגשות הדרושה.");
    }

    if (renderNotes(notes)) cards.push("gapCard");
    revealResults(cards);
    return;
  }

  /* --- כיוון ב': הוזנו שלבים --- */
  const flow = renderFlow(counts, shownDate, days);
  if (!flow) {
    renderHero("אין תשובה", 0, "", "אין תשובה",
      "אף אחד מהשלבים שהוזנו אינו ניתן לחיבור אל תזרים הליך הגיוס.");
    const only = ["heroCard"];
    if (renderNotes(notes)) only.push("gapCard");
    revealResults(only);
    return;
  }
  cards.push("flowCard");

  const shown = flow.hires_in_time !== null && flow.hires_in_time !== undefined
    ? flow.hires_in_time : flow.hires;

  if (flow.hires_in_time !== null && flow.hires_in_time !== undefined) {
    renderHero("מגויסים עד " + fmtDay(shownDate), shown,
      "נותרו " + fmtSpan(flow.span_days) + " · " + nf(flow.hires) +
        " בסך הכול, גם אחרי התאריך",
      "מאיפה בא המספר הזה",
      [nf(shown) + " מתוך " + nf(flow.hires) + " שיתגייסו בחלון הזה " +
       "יספיקו להתגייס עד " + fmtDay(shownDate) + ".",
       "הפער נובע מזמן: מי שנכנס למשפך היום אינו מתגייס מיד. החלק " +
       "שמספיק נמדד מעקומת הגיוס שנבנתה יום ביום מקובצי המקור.",
       nf(flow.known.hires) + " מהגיוסים מגיעים מ«" + flow.known.label +
       "» ומתחלקים אחיד על פני החלון, ולכן כולם בתוכו."]);
  } else {
    renderHero("מגויסים צפויים", flow.hires, "",
      "מאיפה בא המספר הזה",
      [nf(flow.new.hires) + " נגזרים מהמשפך  +  " + nf(flow.known.hires) +
       " מ«" + flow.known.label + "» = " + nf(flow.hires) + " גיוסים.",
       "«" + flow.known.label + "» היא נתיב קבוע שאינו עובר בהליך המיון " +
       "ואינו תלוי בכמות שבמשפך. עד 2026-09-03 הוא לא נספר כאן, ולכן " +
       "המספר יצא קטן בהרבה ממה שהארגון מגייס בפועל.",
       "הכמות שמוזנת בכל שלב היא נפח לאורך החלון, ולא מלאי רגעי."]);
  }

  const m = Engine.constrainedMatrix(counts, days, NEW_ONLY);
  if (renderWhen(m, shownDate)) cards.push("whenCard");
  if (renderMatrix(m, shownDate, days)) cards.push("matrixCard");
  if (renderTimeline(counts, days, shownDate)) cards.push("timelineCard");

  flow.entries.forEach(e => {
    if (e.via === "measured") {
      notes.push({ kind: "warn", text:
        "«" + e.label + "» אינו מופיע בתזרים הליך הגיוס. המעבר ממנו ל«" +
        e.via_label + "» נלקח מהמדידה בקבצים (" + pct(e.via_rate) + "), " +
        "ומשם והלאה היחסים הם של התזרים." });
    }
  });

  if (flow.overlap_warning) {
    notes.push({ kind: "warn", text:
      "הוזנו " + flow.entries.length + " שלבים. הסכום מניח שמדובר בקבוצות " +
      "נפרדות; אם אלה אותם אנשים, הם נספרים פעמיים." });
  }

  if (target !== null) {
    if (renderGapPlan(counts, target, shownDate, days)) cards.push("gapCardPlan");
    const v = Engine.targetVerdict(shown, target);
    if (v) {
      const text = "יעד הגיוס הוא " + nf(v.target) + ", והתחזית היא " +
        nf(v.projected) + ". ";
      if (v.kind === "target_miss") notes.push({ kind: "bad", text: text + "חסרים " + nf(v.gap) + "." });
      else if (v.kind === "target_over") notes.push({ kind: "good", text: text + "עודף של " + nf(v.gap) + "." });
      else notes.push({ kind: "good", text: text + "היעד מושג." });
    }
  }

  if (renderUnits(counts, days, shownDate)) cards.push("unitCard");
  if (renderNotes(notes)) cards.push("gapCard");
  revealResults(cards);
}

function reset() {
  DATA.stages.forEach(s => { $("in_" + s.key).value = ""; });
  $("in_target").value = "";
  $("in_targetDate").value = "";
  $("importFile").value = "";
  importMsg([]);
  ACTIVE_UNITS = null;
  $("results").classList.add("hidden");
  $("stickyBar").classList.remove("show");
  ALL_CARDS.forEach(id => $(id).classList.remove("in"));
}

/* --- הסרגל הדביק --- */
function watchHero() {
  if (typeof IntersectionObserver !== "function") return;
  const bar = $("stickyBar");
  new IntersectionObserver(entries => {
    entries.forEach(e => {
      const gone = !e.isIntersecting && e.boundingClientRect.top < 0;
      bar.classList.toggle("show", gone && !$("results").classList.contains("hidden"));
    });
  }, { threshold: 0 }).observe($("heroCard"));
}

/* ------------------------------------------------------------------ *
 *  ההסבר הכללי. כאן, ורק כאן, מופיעים נתוני המקור הגולמיים.            *

  const af = DATA.annual_flow;
  const text = [

    "הזמנים אינם באים מהתזרים - הוא נושא יחסים בלבד. הם נמדדים מקובצי " +

    "לא כל שורה בקובץ היא התקדמות אמיתית במשפך. גיוס יום או יומיים אחרי " +
