     "שהוזנו. כל נקודה היא חציון הימים עד ההגעה לאותו שלב, נמדד על " +
     "מועמדים שעברו את המסלול בפועל.",
     "חציון פירושו שמחצית מהמועמדים מגיעים מוקדם יותר ומחציתם מאוחר " +
     "יותר, ולא שכולם מגיעים באותו יום. התאריכים מניחים שהמועמדים " +
     "נמצאים היום בשלב שהוזן.",
     "כשכמה קבוצות תורמות לאותה שורה, הזמן המוצג הוא ממוצע משוקלל לפי " +
     "מספר המועמדים שכל קבוצה תורמת. הפירוט נמצא ב-ⓘ שליד שם השלב."]);
  return true;
}

/* --- גרף 3: מתי צפויים להתגייס --- */
function bucketDate(bucket, start) {
  return bucket.max_days === null
    ? "אחרי " + fmtDay(shiftDays(start, bucket.min_days))
    : "עד " + fmtDay(shiftDays(start, bucket.max_days));
}

function timelineSourceText(row) {
  if (!row.sources.length) return "אין מגויסים בחלון הזה.";
  return row.sources.map(x =>
    nf(x.hires) + " מתוך " + nf(x.from_count) + " ב«" + x.from_label +
    "» (" + pct(x.share) + " ממי שיתגייס מהם)").join("  +  ");
}

function renderTimeline(counts, cutoffDays, targetDate) {
  const body = $("timelineBody");
  body.innerHTML = "";
  const merged = Engine.combinedTimeline(counts);
  if (!merged || !merged.total) return false;

  const start = todayDay();
  const byKey = {};
  DATA.time_buckets.forEach(b => { byKey[b.key] = b; });

  const block = el("div", "cohort");
  const bars = el("div", "bars");
  const maxHires = Math.max.apply(null, merged.rows.map(r => r.hires).concat([1]));

  merged.rows.forEach((r, i) => {
    // חלון שכולו אחרי תאריך היעד מסומן ככזה, כדי שיהיה ברור מה
    // נספר בתוך התאריך ומה כבר מאוחר ממנו.
    const b = byKey[r.key];
    const late = cutoffDays !== null && cutoffDays !== undefined &&
                 b.min_days > cutoffDays;
    const row = el("div", "bar-row" + (late ? " late" : ""));

    const name = el("div");
    const title = el("div", "barname");
    title.append(el("span", null, r.label),
                 infoBtn(r.label, timelineSourceText(r) +
                   (late ? "  ·  החלון הזה מאוחר מתאריך היעד ואינו נספר בו." : "")));
    name.append(title);
    name.append(el("small", "tlcount", bucketDate(b, start) +
                   (late ? " · אחרי תאריך היעד" : "")));

    const track = el("div", "bar-track");
    const fill = el("div", "bar-fill");
    track.append(fill);
    later(() => { fill.style.width = ((r.hires / maxHires) * 100).toFixed(1) + "%"; },
          90 + i * 60);

    const val = el("div", "bar-val");
    countUp(val, r.hires, 850);

    row.append(name, track, val);
    bars.append(row);
  });

  block.append(bars);
  body.append(block);

  setInfo("timelineInfo", "מתי יתגייסו",
    [nf(merged.total) + " מגויסים צפויים בסך הכול, מפוזרים על פני הזמן. " +
     "כל קבוצה שהוזנה מפזרת את המגויסים שלה לפי התפלגות הזמנים של השלב " +
     "שממנו היא נגזרת, והשורות נסכמות.",
     targetDate
       ? "החלונות שמאוחרים מ-" + fmtDay(targetDate) + " מסומנים בהיר: הם " +
         "אינם נספרים במספר שבראש העמוד."
       : "התאריכים מניחים שהמועמדים נמצאים היום בשלב שהוזן."]);
  return true;
}

function fmtRate(perDay) {
  if (perDay === null || perDay === undefined) return "—";
  return perDay >= 10 ? nf(Math.round(perDay))
                      : perDay.toFixed(1).replace(/\.0$/, "");
}

/* ------------------------------------------------------------------ *
 *  המחשבון עם האילוצים - התשובה הראשית לשאלה «כמה צריך כדי לגייס X»    *
 *                                                                     *
 *  שלושת האילוצים שהמשתמש הגדיר:                                       *
 *   1. שני נתיבים. «אוכלוסייה מוכרת» מגיעה ביחס 1:1 ואינה עוברת מיון,  *
 *      ולכן אינה נגזרת מכמות ההגשות. רק «האוכלוסייה החדשה» כן.         *
 *   2. הנתיב המוכר קבוע ואינו ניתן להגדלה, ומתפרס אחיד על פני השנה.    *
 *   3. היחסים באים מתרשים תזרים הליך הגיוס ולא מרישום הפעילויות.       *
 *  מרכז הערכה מוצג כתחנת צד מקווקוות ואינו בשרשרת - בקשה מפורשת.       *
 * ------------------------------------------------------------------ */
function renderConstrained(target, targetDate, days) {
  const plan = Engine.constrainedPlan(target, days);
  const body = $("constraintBody");
  const lanes = $("constraintLanes");
  body.innerHTML = "";
  lanes.innerHTML = "";
  if (!plan) return false;

  const span = plan.span_days;
  const spanText = plan.annual
    ? "שנה שלמה (365 יום)"
    : nf(span) + " ימים, עד " + fmtDay(targetDate);

  const box = (cls, name, val, why) => {
    const d = el("div", "lanebox " + cls);
    const h = el("div", "lname");
    h.append(el("span", null, name), infoBtn(name, why));
    d.append(h, el("div", "lval", nf(val)));
    return d;
  };

  lanes.append(box("known", plan.known.label + " · יחס 1:" + plan.known.ratio,
    plan.known.hires,
    "קבוע. " + nf(plan.known.per_year) + " גיוסים בשנה שאינם עוברים בהליך " +
    "המיון כלל, ולכן אינם דורשים הגשות. " +
    (plan.annual ? "אין דרך להגדיל אותם."
                 : "הם מתחלקים אחיד על פני השנה, ולכן ב-" + nf(span) +
                   " ימים הם " + nf(plan.known.hires) + ".")));

  lanes.append(box("newp", plan.new.label + " · יחס 1:" +
      Math.round(plan.new.ratio), plan.new.hires,
    plan.shortfall
      ? "היעד קטן מהנתיב המוכר, ולכן אינו דורש אף הגשה."
      : "כל השאר. אלה הגיוסים היחידים שנגזרים מכמות ההגשות, בשיעור " +
        pct(plan.new.hire_rate) + " מהגשה לגיוס."));

  lanes.append(box("tot", "הגשות דרושות", plan.submissions,
    "כדי לגייס " + nf(plan.target) + " ב" + spanText + " צריך " +
    nf(plan.submissions) + " הגשות. זו התשובה הראשית של המחשבון."));

  const max = Math.max.apply(null, plan.rows.map(r => r.total).concat([1]));
  const asideAfter = {};
  plan.aside.forEach(a => {
    if (!asideAfter[a.after]) asideAfter[a.after] = [];
    asideAfter[a.after].push(a);
  });

  let i = 0;
  const addAside = (a) => {
    const row = el("div", "fstage aside");
    const head = stageHead("↳ " + a.label, a.label,
      "תחנת צד, לא בשרשרת. בתרשים היא יושבת אחרי «" + Engine.label(a.after) +
      "», ו-95% ממי שמגיע אליה ממשיך הלאה - היא כמעט אינה מסננת. היא אינה " +
      "משתתפת בחישוב ואינה תחנת חובה בדרך לגיוס.",
      pct(a.share_of_host) + " מ«" + Engine.label(a.after) + "»");
    const track = el("div", "ftrack");
    const bar = el("div", "fbar");
    track.append(bar);
    const width = ((a.total / max) * 100).toFixed(1);
    later(() => { bar.style.width = width + "%"; }, 70 + (i++) * 60);
    row.append(head, track, el("div", "fval", nf(a.total)));
    body.append(row);
  };

  plan.rows.forEach((r, idx) => {
    const row = el("div", "fstage" + (r.is_hire ? " hire" : ""));

    // אחוז המעבר מהשלב הקודם. זה מה שביקשו להשאיר לצד הכמות.
    const prev = idx > 0 ? plan.rows[idx - 1] : null;
    const chip = prev && prev.rate_to_next
      ? pct(prev.rate_to_next) + " מ«" + prev.label + "»" : null;

    // מקור הכמות. הצבע בעמודה מפריד בין הנתיבים, וההסבר אומר במפורש
    // כמה תרם כל אחד מהם.
    let why = "";
    if (r.known) {
      why += nf(r.new) + " " + plan.new.label + " (כחול)  +  " +
             nf(r.known) + " " + plan.known.label + " (כתום). ";
    } else {
      why += nf(r.new) + " " + plan.new.label + " בלבד - " +
             plan.known.label + " אינה עוברת בשלב הזה. ";
    }
    if (chip) {
      why += "מ«" + prev.label + "» מגיעים לכאן " + pct(prev.rate_to_next) +
             " מהאוכלוסייה החדשה, לפי תזרים " + plan.year + ". ";
    }
    if (r.rate_to_next) {
      why += "מכאן ממשיכים ל«" + Engine.label(r.to_next) + "» " +
             pct(r.rate_to_next) + ". ";
    }
    why += "ב-" + plan.year + " עברו כאן " + nf(r.baseline) + ", וכאן " +
           nf(r.total) + " - פי " + r.pace.toFixed(2) + ".";
    if (!plan.annual) {
      why += " בקצב של " + fmtRate(r.per_day) + " ליום, לעומת " +
             fmtRate(r.baseline_per_day) + " ב-" + plan.year + ".";
    }

    const head = stageHead(r.label, r.label, why, chip);

    const track = el("div", "ftrack");
    const bar = el("div", "fbar split");
    const segNew = el("div", "fseg newpop");
    const segKnown = el("div", "fseg knownpop");
    bar.append(segNew, segKnown);
    track.append(bar);
    const wNew = ((r.new / max) * 100).toFixed(2);
    const wKnown = ((r.known / max) * 100).toFixed(2);
    later(() => {
      segNew.style.width = wNew + "%";
      segKnown.style.width = wKnown + "%";
    }, 70 + (i++) * 60);

    const val = el("div", "fval");
    countUp(val, r.total, 850);

    row.append(head, track, val);
    body.append(row);

    (asideAfter[r.key] || []).forEach(addAside);
  });

  const info = [
    "היעד: " + nf(plan.target) + " גיוסים ב" + spanText + ". התשובה: " +
    nf(plan.submissions) + " הגשות.",
    "היחסים בין השלבים נלקחו מתזרים הליך הגיוס " + plan.year + " שהתקבל " +
    "בתרשים, ולא מרישום הפעילויות. הרישום חסר - כמחצית מהמגויסים אינם " +
    "מופיעים בו כלל - ולכן הוא נותן יחסים מנופחים.",
    "הגיוסים מפוצלים לשני נתיבים, ורק אחד מהם גדל עם ההגשות. כחול הוא " +
    "האוכלוסייה החדשה, שעוברת את כל הליך המיון; כתום היא האוכלוסייה " +
    "המוכרת, שמגיעה ביחס 1:1, אינה עוברת מיון ואינה ניתנת להגדלה."
  ];
  if (plan.shortfall) {
    info.push("היעד שהוזן קטן מהנתיב המוכר, ולכן הוא מושג בלי אף הגשה חדשה.");
  } else {
    info.push("שיעורי המעבר בשרשרת חושבו על האוכלוסייה החדשה בלבד, מפני " +
      "שהאוכלוסייה המוכרת אינה עוברת סינון. חישוב על הנפח המעורב היה " +
      "מנפח את המעבר האחרון.");
    info.push("הגיוסים גדלים פי " + plan.target_growth.toFixed(2) +
      " אך ההגשות פי " + plan.growth.toFixed(2) + " - שתי הצמיחות מול " +
      "אותו חלון זמן - מפני שהנתיב המוכר אינו גדל וכל התוספת נופלת על " +
      "הנתיב היחיד שכן גדל.");
  }
  info.push("מרכז הערכה מוצג כתחנת צד מקווקוות ואינו משתתף בחישוב: הוא " +
    "אינו תחנת חובה בדרך לגיוס.");
  setInfo("constraintInfo", "כמה צריך כדי לגייס את היעד", info);
  return true;
}

/* --- כמה עוד צריך, מעבר למי שכבר בתהליך --- */
function renderGapPlan(counts, target, cutoffDays, targetDate) {
  const plan = Engine.gapPlan(counts, target, cutoffDays);
  const body = $("gapPlanBody");
  body.innerHTML = "";
  if (!plan) return false;

  const until = targetDate ? " עד " + fmtDay(targetDate) : "";
  const from = plan.sources.map(x =>
    nf(x.hires) + " מ־" + nf(x.from_count) + " ב«" + x.from_label + "»").join("  +  ");

  if (plan.gap <= 0) {
    $("gapPlanSub").textContent =
      "כבר בדרך: " + nf(plan.have) + " · היעד: " + nf(target) +
      " · עודף: " + nf(-plan.gap);
    setInfo("gapPlanInfo", "כמה עוד צריך",
      ["המועמדים שכבר בתהליך צפויים להניב " + nf(plan.have) + " מגויסים" +
       until + ", והיעד הוא " + nf(target) + ". היעד מושג בלי להכניס אף " +
       "מועמד חדש.", "מקור המספר: " + from + "."]);
    body.append(el("div", "msg good",
      "אין צורך בתוספת. " + nf(plan.have) + " צפויים מול יעד של " + nf(target) + "."));
    $("gapPipeBody").innerHTML = "";
    return true;
  }

  $("gapPlanSub").textContent =
    "כבר בדרך: " + nf(plan.have) + " · היעד: " + nf(target) +
    " · חסרים: " + nf(plan.gap);

  setInfo("gapPlanInfo", "כמה עוד צריך",
    ["המועמדים שכבר בתהליך צפויים להניב " + nf(plan.have) + " מגויסים" +
     until + " (" + from + "). היעד הוא " + nf(target) + ", ולכן חסרים " +
     nf(plan.gap) + ".",
     "כל שורה אומרת כמה מועמדים חדשים באותו שלב יסגרו את הפער הזה - לא " +
     "את כל היעד. השורות אינן מצטברות זו לזו: אלו תשובות חלופיות.",
     cutoffDays !== null
       ? "השיעור שבשימוש הוא שיעור הגיוס של השלב כפול החלק ממנו שמספיק " +
         "להתגייס תוך " + nf(cutoffDays) + " הימים שנותרו."
       : "",
     "המשפך שמתחת לבורר הוא אותה השלמה כמשפך רציף אחד: אותם אנשים " +
     "בזמנים שונים."]);

  const withData = plan.rows.filter(r => r.has_data && r.required !== null);
  const max = Math.max.apply(null, withData.map(r => r.required).concat([1]));

  plan.rows.forEach((r, i) => {
    if (!r.has_data) return;

    if (r.required === null) {
      const row = el("div", "fstage nodata");
      row.append(stageHead(r.label, r.label,
          "מועמד שייכנס עכשיו ל«" + r.label + "» לא יספיק להתגייס תוך " +
          nf(cutoffDays) + " ימים. השלב הזה אינו יכול לתרום ליעד הזה בזמן " +
          "שנותר."),
        el("div", "ftrack"), el("div", "fval blocked", "לא יספיק"));
      body.append(row);
      return;
    }

    let why = nf(r.required) + " מועמדים חדשים ב«" + r.label + "» יניבו את " +
              nf(plan.gap) + " המגויסים החסרים, לפי שיעור גיוס " + pct(r.rate);
    if (cutoffDays !== null && r.share_in_time < 1) {
      why += ", שממנו " + pct(r.share_in_time) + " מספיקים להתגייס תוך " +
             nf(cutoffDays) + " ימים, כלומר " + pct(r.effective_rate) + " בפועל";
    }
    why += ".";

    const row = el("div", "fstage");
    const head = stageHead(r.label, r.label, why, pct(r.effective_rate));

    const track = el("div", "ftrack");
    const bar = el("div", "fbar");
    track.append(bar);
    later(() => { bar.style.width = ((r.required / max) * 100).toFixed(1) + "%"; },
          70 + i * 60);

    const val = el("div", "fval");
    countUp(val, r.required, 850);

    row.append(head, track, val);
    body.append(row);
  });

  renderGapPipeline(plan, cutoffDays);
  return true;
}

function renderGapPipeline(plan, cutoffDays) {
  const body = $("gapPipeBody");
  body.innerHTML = "";
  const key = $("gapEntry").value || Engine.stageKeys(true)[0];
  const row = plan.rows.filter(r => r.key === key)[0];
  if (!row || row.required === null) {
    body.append(el("div", "msg warn",
      "מ«" + (row ? row.label : key) + "» אי אפשר להשלים את הפער בזמן שנותר."));
    return;
  }

  const proj = Engine.projectCohort(key, row.required);
  const max = Math.max.apply(null, proj.steps.map(x => x.count).concat([1]));
  proj.steps.forEach((step, i) => {
    const r = el("div", "fstage" +
      (step.is_hire ? " hire" : step.is_source ? " source" : ""));
    const head = stageHead(step.label, step.label, step.is_source
        ? "נקודת הכניסה של ההשלמה: " + nf(row.required) + " מועמדים חדשים " +
          "ב«" + row.label + "» סוגרים את הפער של " + nf(plan.gap) + " גיוסים."
        : nf(step.count) + " מתוך " + nf(row.required) + " (" + pct(step.reach) +
          "), חציון " + Math.round(step.days_median) + " ימים אחרי הכניסה.",
      step.is_source ? "נדרש" : pct(step.reach),
      step.is_source ? "chip" : "fpct");

    const track = el("div", "ftrack");
    const bar = el("div", "fbar");
    track.append(bar);
    later(() => { bar.style.width = ((step.count / max) * 100).toFixed(1) + "%"; },
          70 + i * 60);

    const val = el("div", "fval");
    countUp(val, step.count, 850);

    r.append(head, track, val);
    body.append(r);
  });
}

/* --- הכול בטבלה אחת: כמה בכל שלב, ומתי --- *
 * שורה לכל שלב, עמודה לכל חלון זמן. סכום התאים שווה בדיוק לעמודת הסך
 * הכול - הפיזור מעוגל על הסכום הרץ.                                   */
function matrixSourceText(r) {
  const parts = r.sources.map(x =>
    nf(x.count) + " מתוך " + nf(x.from_count) + " ב«" + x.from_label +
    "» (" + pct(x.reach) + "), חציון " + Math.round(x.days_median) + " ימים");
  return parts.join("  +  ") + (r.weighted
    ? "  ·  החציון המוצג הוא ממוצע משוקלל לפי מספר המועמדים שכל קבוצה תורמת"
    : "");
}

function renderMatrix(counts, targetDate, cutoffDays) {
  const m = Engine.combinedMatrix(counts);
  const body = $("matrixBody");
  body.innerHTML = "";
  if (!m.rows.length) return false;

  const start = todayDay();
  const timed = cutoffDays !== null && cutoffDays !== undefined;

  const head = el("tr");
  head.append(el("th", null, "שלב"));
  m.buckets.forEach(b => {
    const late = timed && b.min_days > cutoffDays;
    head.append(el("th", null, b.label + (late ? " ⟵ מאוחר" : "")));
  });
  head.append(el("th", null, "סך הכול"), el("th", null, "חציון ימים"));
  body.append(head);

  m.rows.forEach(r => {
    const tr = el("tr", r.is_hire ? "hire" : "");
    const stage = el("td", "stage");
    const cell = el("div", "cellname");
    cell.append(el("span", null, r.label), infoBtn(r.label, matrixSourceText(r)));
    stage.append(cell);
    tr.append(stage);
    r.cells.forEach((c, i) => {
      const late = timed && m.buckets[i].min_days > cutoffDays;
      tr.append(el("td", "num" + (late ? " late" : ""), nf(c.count)));
    });
    tr.append(el("td", "num big hi", nf(r.count)));
    tr.append(el("td", "num", Math.round(r.days_median)));
    body.append(tr);
  });

  setInfo("matrixInfo", "כמה בכל שלב, ומתי",
    ["שורה לכל שלב, עמודה לכל חלון זמן. התא הוא כמה מועמדים יגיעו לשלב " +
     "ההוא בתוך החלון ההוא, מסכום כל הקבוצות שהוזנו. השורה התחתונה היא " +
     "הגיוס עצמו.",
     "סכום התאים בשורה שווה בדיוק לעמודת «סך הכול»: הפיזור מעוגל על " +
     "הסכום הרץ, כדי שהטבלה תמיד תסתכם.",
     "החלונות נמדדים מהיום שבו המועמדים נמצאים בשלב שהוזן: " +
     m.buckets.map(b => b.label + " = " +
       (b.max_days === null ? "אחרי " + fmtDay(shiftDays(start, b.min_days))
                            : "עד " + fmtDay(shiftDays(start, b.max_days)))
     ).join(" · ") + ".",
     timed ? "החלונות שכולם אחרי " + fmtDay(targetDate) + " מסומנים - הם " +
             "אינם נספרים ביעד." : ""]);
  return true;
}

/* --- אזהרת כיסוי --- *
 * שיעור המעבר אומר מה קורה למי שנמצא בשלב. הכיסוי אומר דבר אחר: כמה
 * מהגיוסים בכלל עוברים שם.                                            */
function coverageNotes(keys) {
  return Engine.lowCoverage(keys).map(c => ({ kind: "warn", text:
    "רק " + pct(c.share) + " מהמגויסים נרשמו בכלל ב«" + c.label + "». " +
    "כמות שמוזנת שם אינה יכולה להסביר את כלל הגיוסים - השאר מגיעים בדרך " +
    "שאינה עוברת בשלב הזה." }));
}

/* --- הערות ובדיקות --- */
function renderNotes(messages) {
  const body = $("gapBody");
  body.innerHTML = "";
  messages.forEach(m => body.append(el("div", "msg " + m.kind, m.text)));
  if (!body.children.length) {
    body.append(el("div", "msg flat", "אין הערות."));
  }
}

/* --- חשיפת התוצאות --- */
const ALL_CARDS = ["heroCard", "constraintCard", "gapCardPlan", "funnelCard",
                   "matrixCard", "whenCard", "timelineCard", "gapCard"];

function revealResults(cards) {
  $("results").classList.remove("hidden");
  cards.forEach(id => $(id).classList.remove("in"));
  ALL_CARDS.forEach(id => {
    $(id).classList.toggle("hidden", cards.indexOf(id) === -1);
  });

  if (!CAN_ANIMATE) { cards.forEach(id => $(id).classList.add("in")); return; }
  cards.forEach((id, i) => setTimeout(() => $(id).classList.add("in"), 40 + i * 110));

  const results = $("results");
  if (results && typeof results.scrollIntoView === "function") {
    setTimeout(() => results.scrollIntoView({ behavior: "smooth", block: "start" }), 80);
  }
}

/* --- ההרצה הראשית --- */
let gapCounts = null;
let gapTarget = null;
let gapDays = null;

function calculate() {
  const { counts, target, targetDate, badDate } = readInputs();
  const entered = Engine.stageKeys().filter(k => counts[k] !== null && Engine.hasRate(k));
  const notes = [];

  DATA.stages.forEach(s => {
    if (!s.has_data && counts[s.key] !== null) {
      notes.push({ kind: "warn", text:
        "הנתון שהוזן בשלב «" + s.label + "» נרשם אך לא שימש לחישוב: אין " +
        "בקבצי המקור נתוני המרה לשלב הזה." });
    }
  });

  const manual = {};
  DATA.stages.forEach(s => { manual[s.key] = counts[s.key]; });

  if (badDate) {
    notes.push({ kind: "warn", text:
      "«" + badDate + "» אינו תאריך תקין ולכן לא נלקח בחשבון. " +
      "שים לב שיש חודשים בני 30 יום." });
  }

  if (!entered.length && target === null) {
    $("results").classList.add("hidden");
    return;
  }

  /* --- מצב תכנון מיעד: רק יעד גיוס הוזן --- *
   * התשובה היחידה כאן היא המחשבון עם האילוצים. הוא היחיד שמפריד בין
   * הגיוסים שעוברים בהליך המיון לבין אלה שאינם עוברים בו, ולכן היחיד
   * שאינו מנפח ואינו מכווץ את כמות ההגשות.                            */
  if (!entered.length) {
    const onlyDays = targetDate === null
      ? null : daysBetween(todayDay(), targetDate);
    const planDays = onlyDays !== null && onlyDays >= 0 ? onlyDays : null;

    const cp = Engine.constrainedPlan(target, planDays);
    if (cp) {
      renderHero(
        "הגשות דרושות ל-" + nf(target) + " גיוסים",
        cp.submissions,
        cp.annual ? "בשנה שלמה" : "עד " + fmtDay(targetDate) + " · " +
          nf(cp.span_days) + " ימים",
        "מאיפה בא המספר הזה",
        ["כדי לגייס " + nf(target) + " צריך " + nf(cp.submissions) +
         " הגשות. לעומת " + nf(cp.baseline_in_span) + " בקצב של " + cp.year +
         " באותו אורך זמן - פי " + cp.growth.toFixed(2) + ".",
         nf(cp.known.hires) + " מהגיוסים מגיעים מ«" + cp.known.label +
         "» ואינם עוברים בהליך המיון כלל, ולכן אינם דורשים הגשות. רק " +
         nf(cp.new.hires) + " הגיוסים של «" + cp.new.label + "» נגזרים " +
         "מהמשפך, ביחס 1:" + Math.round(cp.new.ratio) + ".",
         "מפני שהנתיב המוכר קבוע ואינו ניתן להגדלה, כל התוספת נופלת על " +
         "הנתיב שכן גדל: הגיוסים גדלים פי " + cp.target_growth.toFixed(2) +
         " וההגשות פי " + cp.growth.toFixed(2) + "."]);
    } else {
      renderHero("יעד גיוס", target, "", "יעד גיוס",
        "אין מספיק נתונים כדי לגזור את כמות ההגשות הדרושה.");
    }

    const hasConstraint = renderConstrained(target, targetDate, planDays);

    if (badDate === null && targetDate === null && target > 0) {
      notes.push({ kind: "flat", text:
        "לא הוזן תאריך יעד, ולכן היעד נקרא כיעד שנתי." });
    }
    renderNotes(notes);

    const targetCards = ["heroCard"];
    if (hasConstraint) targetCards.push("constraintCard");
    targetCards.push("gapCard");
    revealResults(targetCards);
    return;
  }

  /* --- מצב גזירה קדימה --- */
  const result = Engine.combine(counts);

  const cutoffDays = targetDate === null ? null : daysBetween(todayDay(), targetDate);
  const byDate = cutoffDays !== null && cutoffDays >= 0
    ? Engine.combinedByDay(counts, cutoffDays) : null;

  const heroFrom = result.cohorts.map(c =>
    nf(c.hires) + " מתוך " + nf(c.count) + " ב«" + c.label + "»").join("  +  ");

  if (byDate) {
    renderHero(
      "מגויסים עד " + fmtDay(targetDate),
      byDate.hires,
      nf(byDate.hires) + " מתוך " + nf(byDate.eventual) + " בסך הכול",
      "מאיפה בא המספר הזה",
      [nf(byDate.hires) + " מתוך " + nf(byDate.eventual) + " שיתגייסו " +
       "בסופו של דבר, כלומר " + pct(byDate.hires / byDate.eventual) +
       " מהם, בתוך " + nf(cutoffDays) + " ימים.",
       byDate.sources.map(x =>
         nf(x.hires) + " מתוך " + nf(x.eventual) + " שיתגייסו מ-" +
         nf(x.from_count) + " ב«" + x.from_label + "» (" + pct(x.share) +
         " מהם מתגייסים תוך " + nf(cutoffDays) + " ימים)").join("  +  ") + ".",
       "העקומה נמדדת יום ביום מקובצי המקור, ולא נגזרת מחלונות הזמן."]);
  } else {
    renderHero("מגויסים צפויים", result.hires,
      result.cohorts.length === 1
        ? "מתוך " + nf(result.cohorts[0].count) + " ב«" + result.cohorts[0].label + "»"
        : "מסך " + result.cohorts.length + " הקבוצות שהוזנו",
      "מאיפה בא המספר הזה",
      [heroFrom + ".",
       "הגזירה היא קדימה בלבד: כל מספר שהוזן נחשב לקבוצה שנמצאת עכשיו " +
       "באותו שלב, ומחושב רק מה שקורה לה הלאה."]);
  }

  renderFunnel(result.per_stage, manual,
                result.cohorts.length === 1 ? result.cohorts[0].count : null);
  setInfo("funnelInfo", "כמה יגיעו לכל שלב",
    [result.cohorts.length === 1
      ? "הכול נגזר מ-" + nf(result.cohorts[0].count) + " המועמדים שהוזנו ב«" +
        result.cohorts[0].label + "», קדימה בלבד."
      : "כל שלב מציג את הסכום של כל הקבוצות שהוזנו. הפירוט לכל שורה נמצא " +
        "ב-ⓘ שליד שם השלב.",
     "כל מעבר נמדד ישירות בין שני השלבים שלו, ולא כמכפלה של אחוזי מעבר. " +
     "לכן המשפך אינו יורד בהכרח משלב לשלב: לא כל מועמד עובר בכל השלבים.",
     "שיעורי ההגעה מודדים הגעה לשלב, לא מעבר בו."]);

  const hasMatrix = renderMatrix(counts, targetDate, cutoffDays);
  const hasWhen = renderWhen(counts);
  const hasTimeline = renderTimeline(counts, cutoffDays, byDate ? targetDate : null);

  coverageNotes(entered).forEach(n => notes.push(n));

  if (result.overlap_warning) {
    notes.push({ kind: "warn", text:
      "הוזנו " + result.cohorts.length + " שלבים, והסכום מניח שמדובר בקבוצות " +
      "נפרדות. אם אותם מועמדים נמצאים ביותר משלב אחד, הם נספרים כאן פעמיים." });
  }

  Engine.crossCheck(counts).forEach(cc => {
    const base = "מ-" + nf(cc.early_count) + " ב«" + Engine.label(cc.early) +
                 "» צפויים להגיע ל«" + Engine.label(cc.late) + "» " + nf(cc.expected) +
                 " מועמדים, והוזנו " + nf(cc.actual) + ". ";
    if (cc.verdict === "matches") {
      notes.push({ kind: "good", text: base + "המספרים עקביים זה עם זה." });
    } else if (cc.verdict === "fewer") {
      notes.push({ kind: "bad", text: base + "חסרים " + nf(cc.gap) +
        " ביחס לצפוי - אם מדובר באותם אנשים." });
    } else {
      notes.push({ kind: "good", text: base + "עודף של " + nf(cc.gap) +
        " ביחס לצפוי - אם מדובר באותם אנשים." });
    }
  });

  if (byDate) {
    notes.unshift({ kind: "flat", text:
      "עד " + fmtDay(targetDate) + " צפויים " + nf(byDate.hires) + " מגויסים. " +
      "בסך הכול, בלי הגבלת זמן, יתגייסו " + nf(byDate.eventual) + "." });
  } else if (cutoffDays !== null && cutoffDays < 0) {
    notes.push({ kind: "warn", text:
      "תאריך היעד שהוזן, " + fmtDay(targetDate) + ", כבר עבר. " +
      "מוצג מספר המגויסים בסופו של דבר." });
  }

  /* היעד נמדד מול מה שנשאל: אם הוזן תאריך, מול מה שיתגייס עד אז. */
  const against = byDate ? byDate.hires : result.hires;
  /* יעד יחד עם מלאי קיים: כמה עוד צריך, ולא כמה צריך מאפס */
  let hasGapPlan = false;
  if (target !== null) {
    gapCounts = counts;
    gapTarget = target;
    gapDays = cutoffDays !== null && cutoffDays >= 0 ? cutoffDays : null;
    hasGapPlan = renderGapPlan(counts, target, gapDays,
                               gapDays === null ? null : targetDate);
  }

  const v = Engine.targetVerdict(against, target);
  if (v) {
    const text = "יעד הגיוס הוא " + nf(v.target) +
      (byDate ? ", והתחזית עד " + fmtDay(targetDate) + " היא " : ", והתחזית היא ") +
      nf(v.projected) + ". ";
    if (v.kind === "target_miss") notes.push({ kind: "bad", text: text + "חסרים " + nf(v.gap) + "." });
    else if (v.kind === "target_over") notes.push({ kind: "good", text: text + "עודף של " + nf(v.gap) + "." });
    else notes.push({ kind: "good", text: text + "היעד מושג." });
  }

  renderNotes(notes);

  const cards = ["heroCard"];
  if (hasGapPlan) cards.push("gapCardPlan");
  cards.push("funnelCard");
  if (hasMatrix) cards.push("matrixCard");
  if (hasWhen) cards.push("whenCard");
  if (hasTimeline) cards.push("timelineCard");
  cards.push("gapCard");
  revealResults(cards);
}

function reset() {
  DATA.stages.forEach(s => { $("in_" + s.key).value = ""; });
  $("in_target").value = "";
  $("in_targetDate").value = "";
  gapCounts = null;
  gapTarget = null;
  gapDays = null;
  $("results").classList.add("hidden");
  $("stickyBar").classList.remove("show");
  ALL_CARDS.forEach(id => $(id).classList.remove("in"));
}

/* --- הסרגל הדביק: מופיע כשכרטיס התוצאה יוצא מהמסך --- */
function watchHero() {
  if (typeof IntersectionObserver !== "function") return;
  const bar = $("stickyBar");
  new IntersectionObserver(entries => {
    entries.forEach(e => {
      const gone = !e.isIntersecting && e.boundingClientRect.top < 0;
      bar.classList.toggle("show", gone && !$("results").classList.contains("hidden"));
    });
  }, { threshold: 0 }).observe($("heroCard"));
}

/* ------------------------------------------------------------------ *
 *  ההסבר הכללי - שיטת החישוב ומגבלות הנתונים.                          *
 *  כאן, ורק כאן, מופיעים נתוני המקור הגולמיים.                         *
 * ------------------------------------------------------------------ */
function buildAbout() {
  const m = DATA.meta;
  const text = [
    "המחשבון עונה על שתי שאלות. הראשונה: כמה מועמדים צריך בכל שלב כדי " +
    "לגייס מספר מסוים - ממלאים «יעד גיוס» בלבד. השנייה: כמה יתגייסו " +
    "מקבוצה שנמצאת עכשיו בשלב מסוים - ממלאים את השלב.",
    "התשובה לשאלה הראשונה נשענת על תזרים הליך הגיוס שהתקבל בתרשים. " +
    "הגיוסים מפוצלים לשני נתיבים: «אוכלוסייה מוכרת» שמגיעה ביחס 1:1, " +
    "אינה עוברת מיון ואינה ניתנת להגדלה, ו«אוכלוסייה חדשה» שעוברת את כל " +
    "המשפך. רק הנתיב השני נגזר מכמות ההגשות, ולכן תוספת ליעד נופלת כולה " +
    "עליו.",
    "התשובה לשאלה השנייה נמדדת מקובצי המקור: לכל זוג שלבים נמדד ישירות " +
    "איזה חלק מהמועמדים שהיו בשלב הראשון הגיעו בפועל לשלב השני, וכמה " +
    "ימים זה לקח. זו מדידה ישירה של הזוג, ולא מכפלה של אחוזי מעבר.",
    "הנתונים קטועים מימין: מועמד שביצע פעילות סמוך לסוף התקופה עדיין לא " +
    "הספיק להתקדם. לכן כל שיעור נמדד בשני בסיסים - אחד על חלון זמן קבוע, " +
    "ואחד על קוהורטים שהספיקו להבשיל - והערך שבשימוש הוא הממוצע ביניהם.",
    "לא כל שורה בקובץ היא התקדמות אמיתית במשפך. גיוס יום או יומיים אחרי " +
    "בדיקת קבצים אינו מועמד שעבר את התהליך במהירות אלא בדיקה שנרשמה " +
    "בדיעבד. הזיהוי נעשה מצורת ההתפלגות: רישום בדיעבד יוצר בליטה בימים " +
    "הראשונים, אחריה שקע, ואז האוכלוסייה שבאמת עברה את התהליך. הרצפה " +
    "נקבעת בשקע, ושלב שההתפלגות שלו חלקה אינו נחתך כלל."
  ];

  const limits = [
    "הגזירה היא קדימה בלבד. ממספר שהוזן בשלב מסוים אי אפשר לדעת כמה " +
      "מועמדים היו בשלבים שלפניו.",
    "המשפך אינו סדרתי: לא כל מועמד עובר דרך כל השלבים, ולכן מספר " +
      "המועמדים בשלב אינו יורד בהכרח משלב לשלב.",
    "כל השיעורים מודדים הגעה לשלב, לא מעבר בו. לבדיקת קבצים אין בקבצים " +
      "עמודת תוצאה כלל, ולכן אי אפשר לדעת מי עבר אותה ומי נכשל בה.",
    "שלב אינו יושב מעל כל המשפך. כמחצית מהמגויסים אינם נרשמים כלל " +
      "כהגשה, ולכן כמות שמוזנת בשלב אינה מסבירה את סך הגיוס של הארגון.",
    "מרכז הערכה הוא שלב סלקטיבי שרק חלק מהמועמדים עוברים בו, והוא אינו " +
      "תחנת חובה בדרך לגיוס.",
    "הזמן שנותר עד הגיוס אינו יורד בהכרח ככל שמתקדמים בתהליך, כי הוא " +
      "נמדד בכל שלב על קבוצה אחרת - רק על מי שהתגייס בפועל.",
    "הזמנים נמדדים רק על מועמדים שהגיעו בפועל לשלב היעד. מי שנעצר בדרך " +
      "אינו נספר.",
    "הנתונים מכסים " + m.activity_first + " עד " + m.hire_last + " בלבד. " +
      "מועמדים שהחלו את התהליך לפני תחילת התקופה נראים בקובץ כאילו " +
      "התחילו בתוכה.",
    "כשמוזן יותר משלב אחד, המערכת מניחה שמדובר בקבוצות נפרדות ומסכמת " +
      "אותן. היא אינה יכולה לדעת אם אותם מועמדים מופיעים בכמה שלבים.",
    "כל המספרים במחשבון הם מצרפיים. אין בו מזהי מועמדים."
  ];

  const full = text.concat(["מגבלות שחשוב להכיר:"]).concat(limits);
  INFO.aboutBtn = { title: "איך המחשבון עובד", text: full };
  $("aboutBtn").setAttribute("data-info", full.join(" "));
  attachInfo("aboutBtn");

  setInfo("inputInfo", "מה להזין",
    ["אפשר להזין שלב אחד או כמה. כל מספר נחשב לקבוצה שנמצאת עכשיו באותו " +
     "שלב, והגזירה היא קדימה בלבד - אל השלבים שאחריו.",
     "כדי לשאול את השאלה ההפוכה - כמה צריך בכל שלב כדי לגייס מספר מסוים - " +
     "משאירים את כל שדות השלבים ריקים וממלאים רק «יעד גיוס».",
     "אפשר גם לשלב: יעד יחד עם שלבים מחשב כמה עוד צריך מעבר למי שכבר " +
     "בתהליך.",
     "«תאריך היעד» משנה כמויות ולא רק תאריכים: כשיש מועד, הדרישה מחושבת " +
     "לפי החלק שמספיק להתגייס עד אז."]);
}

buildInputs();
buildGapEntry();
buildAbout();
watchHero();
["heroInfo", "constraintInfo", "gapPlanInfo", "funnelInfo", "matrixInfo",
 "whenInfo", "timelineInfo", "inputInfo"].forEach(attachInfo);
$("infoClose").addEventListener("click", closeInfo);
$("infoModal").addEventListener("click", ev => {
  if (ev && ev.target === $("infoModal")) closeInfo();
});
$("calcBtn").addEventListener("click", calculate);
$("resetBtn").addEventListener("click", reset);
$("gapEntry").addEventListener("change", () => {
  if (gapCounts !== null && gapTarget !== null) {
    renderGapPipeline(Engine.gapPlan(gapCounts, gapTarget, gapDays), gapDays);
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeInfo();
  else if (e.key === "Enter") calculate();
});
</script>
</body>
